    - heading "6.1.4 τp、τe 与标准适用范围" [level=4] [ref=e3885]
    - paragraph [ref=e3886]: τp 是本研究对象输入前的运输延迟参数；τe 是对指定闭环频响拟合得到的等效延迟。后者依赖控制器、执行机构、参考模型及拟合协议，不能把 τp 的标签直接替换成 τe。
    - paragraph [ref=e3887]:
      - text: 本研究采用所引 GJB 2874-1997 附录中的四阶滚转 LOES 形式
      - superscript [ref=e3888]: "[13]"
      - text: ：分母包含螺旋、滚转和荷兰滚模态，分子为三阶，再乘 exp(−τe s)。这说明本文采用的拟合结构，不表示所有对象都必然能由它充分描述。
    - paragraph [ref=e3889]: A21 所列 0.10/0.20/0.25 s 在本文仅作为等效延迟的研究性阈值参照。当前输入为滚转角速度指令，评价对象、驾驶员回路和试验覆盖不等于标准符合性流程；RMSE/Peak/TV 与拟合残差门限均由项目设定。未通过拟合门的样本必须单列，不能赋 τe=0 或解释为延迟更好。
    - heading "6.1.5 修复时间对齐后的 LOES 评价" [level=4] [ref=e3890]
    - paragraph [ref=e3891]: 归档主批次为 120 对象×3 策略，短/中/长各 40，180 s 多正弦激励。频点由 0.1–10 rad/s 范围内的整数 DFT 栅格生成。原 run_case 保存 u(t_k) 与 p(t_k+0.02) 却按同一时间序号估计频响；因此输出相位含一个控制周期的超前。
    - paragraph [ref=e3892]: 本次对全部四批、1,440 个已存频响作 H_corrected(ω)=H_archived(ω)·exp(−jω·0.02)，再按原 16 起点、相同参数边界和随机种子重新拟合。拟合器增加了优化器成功退出检查。这里修复的是现有逐频估计的时间坐标，没有重新生成这 1,440 条轨迹，也没有将新实现的联合谐波回归结果混入本表。参考仍为归档 legacy_plant。
    - paragraph [ref=e3893]: 幅值指标实际是 R²_logmag=1−Σ(log|H_fit|−log|H|)²/Σ(log|H|−mean(log|H|))²，不是时域 VAF；项目门限为 R²_logmag≥0.95 且包裹相位 RMSE≤10°。只在过门样本中统计 τe 和阈值档位。
