        - /url: evidence/gjb_audit/verification.json
      - text: 通过，覆盖峰谷公式、截断、真实跨级边界、1 ms 灵敏度回放、参数唯一性和旧库不变性。
    - paragraph [ref=e4257]: 上述样例没有新的 OOD 套件，边界探针也尚未分配训练或测试角色；物理可实现性、任务可达性和策略学习效果尚未验证。等组合配额改变了总体等级比例，不能直接替换历史库后比较通过率。这里证明的是构造规则可复算，不能声称已改善控制性能。
    - heading "7 结论" [level=2] [ref=e4258]
    - paragraph [ref=e4259]: 本研究把品质相关参数化对象、特权教师、统一学生和目标域适配作为飞控控制器构建路线，以滚转通道检验可行性。已完成的三种子实验补齐了连续链路：教师可训练、统一学生可闭环使用，等目标预算下预训练适配优于从零训练，但教师与蒸馏的种子差异、源外退化和长时发散仍明显。结论应为“有阶段性可行性证据，可靠性尚不足”，不应概括为无损压缩或通用稳定。
    - paragraph [ref=e4260]: 已直接修复参考读取真实时延、PPO动作概率不一致、终止后取reset价值、历史与奖励时间错位、蒸馏采样回流及目标接口不一致等问题。新结果属于明确的新协议，不能用于追认缺少源码版本的旧49/46教师与small迁移数值，也没有隔离每个代码修复的性能贡献。
    - paragraph [ref=e4261]: 既有数据复核继续保留：严格1.2s探针R²=0.984、MAE=5.6ms；相位修正后raw/aux的τe可评子集中位数为0.093/0.125s，须同时看可评集合，Top-k不可评不等于零延迟或普遍失稳。两种子表示对照未显示稳定SAE辅助收益。
    - paragraph [ref=e4262]: 下一阶段应先明确满足模型零点与力限制的可达机动，再提高教师与学生训练重复性和长时恢复表现，通过预先声明的对照分离品质采样、信息条件与容量的作用。其他通道、耦合模型和实机验证是此后的扩展；现阶段只做滚转本身不是路线缺陷。
    - paragraph [ref=e4263]: 完整 GJB 核查进一步表明，当前对象库的联合覆盖不足、旧辅助振荡及调节时间量不能作为可靠品质证据。新联合构造样例修正了部分覆盖规则，但尚未开展策略训练；因此本文保留原协议的控制成绩，并将构造验证、训练优化和最终品质验收明确区分。
