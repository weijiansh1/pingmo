    - paragraph [ref=e4183]: 为检验持续控制，另外运行30s的±15 deg/s阶跃和相同初始偏差/扰动恢复。对完全相同的两阶跃，教师源对象通过率从8s的75.0%/50.0%/50.0%降至30s的16.7%/25.0%/16.7%；学生变化并非各组一致，但同一个OOD对象在三个种子的正负阶跃中共出现6次长回合发散。恢复评价采用同偏差/同脉冲有控—无控配对、释放后RMS和带截尾的稳定时间；不把峰包络或有限时域未发散当作模态稳定性证明。
    - paragraph [ref=e4184]: 测试后补充的任务可达性诊断发现，当前模型有原点零点且所选对象λs非零，长期非零恒定p0的精确跟踪力满足dF/dt→−λs p0/(L_Fa T_R R_omega²)。放宽执行机构和时延约束后，30s精确参考跟踪仍有4/12源、5/24 ID、4/24 OOD对象需要超过22N。上述发散对象ood_test-4700在约18.01s越限，30s理想需求44.17N；因此长期失效不能全部归因于RL。精确跟踪不可达不等于非零RMSE/Peak容差不可达，主测试分母保持不变。恢复负结果也保留：第三种子OOD扰动释放RMS有36/48配对高于无控。后续必须同时改进任务可达性定义与恢复控制，不能仅延长恒定速率训练。
