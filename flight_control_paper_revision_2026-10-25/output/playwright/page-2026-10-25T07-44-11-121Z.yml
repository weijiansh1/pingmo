    - paragraph [ref=e4115]: 力限幅和速率限幅在当前桥接下分别对应副翼角度和速率边界，消融时需同步更新源域与目标域接口。后续还应扩大未参与教师训练的同分布和分布外测试集，并在相同对象、指令和安全约束下与常规滚转控制律对照。仿真级对照完成后，再逐步引入更高保真模型、滚转—偏航耦合和机载实时性评估。
    - heading "6.4 品模与 PPO 的进一步核验（v2 阶段记录）" [level=3] [ref=e4116]
    - paragraph [ref=e4117]: 模型包含滚转、螺旋和荷兰滚因子；完整扫描件不同页面的公式差异及本文建模选择现于第 2.2 节明确说明。四维状态空间实现不等于完整飞机的物理状态。库中 2,101 个对象具有发散螺旋极点，这本身不必然违反所用判据；115 个滚转时间常数大于 8 s，619 个荷兰滚衰减时间常数大于 8 s。因此 0.75 s 建库筛查和 8 s 闭环跟踪都不足以证明长时稳定性。大幅值持续速率还可能超出局部小扰动模型的适用范围，需在耦合或非线性模型中另行检验。
    - paragraph [ref=e4118]: 一秒灵敏度的旧实现将积分前输出错放在下一采样时刻。修复后，train_core-0717 的 1 kHz 灵敏度由 3.375472 变为 3.380646 deg/N，标签 L1→L2；train_core-1081 由 5.619090 变为 5.629182 deg/N，标签 L2→研究 OOD／该项未分级。原参数和划分保留，并提供标签修正附表，不把历史训练成绩重命名为新标签协议的成绩。
    - paragraph [ref=e4119]: PPO 的旧 act() 保存裁剪动作却保留裁剪前样本的 log_prob，使权重未改变时的概率比也可能偏离 1。固定 μ=0.95、logσ=−2 的人工反例中，10,000 次采样有 3,532 个裁剪样本，比率中位数为 1.440；这是实现反例，不是历史训练异常频率。修订采用同一原始样本计算新旧概率，仅在环境中裁剪物理动作。末值默认按有限任务置零；监控默认比较同一时刻参考和响应，旧参考区间口径保留为显式选项。
    - paragraph [ref=e4120]: 训练指令库的 30 个条目只有 9 条独立指令，阶跃/双脉冲/正弦/多正弦的条目数为 24/3/2/1，不能称为家族占比 4:3:2:1。v2 的 evaluate() 重用训练指令库，其 monitor 不代表独立测试；v3 现支持独立验证指令，已用于第 6.5 节。训练日志新增近似 KL、剪切比例、梯度范数、动作限幅比例、末值和逐指令指标，以便检查更新过程。
    - paragraph [ref=e4121]:
      - text: 本次 18 项回归检查通过。另在一个对象、32 个并行环境上完成两次 PPO rollout，共 25,600 次转移，确认采集、GAE、更新、评价和权重保存流程可执行；训练库 RMSE 约 20.22 deg/s，未达到控制门限。没有重训原 49 个教师，也没有建立修复前后控制性能对照。完整理论依据、复算记录和复现入口见
      - link "品模与强化学习深查" [ref=e4122] [cursor=pointer]:
        - /url: ../../flight_control_corrected_2026-10-24/02_品模与强化学习深查.md
      - text: 。
    - heading "6.5 飞控控制器路线的连续证据（2026-10-24 冻结实验）" [level=3] [ref=e4123]
    - paragraph [ref=e4124]: 本节研究主体是飞控控制器构建路线，滚转是可行性验证任务。全部对象、种子、指令和预算在训练前冻结。12 源对象按部分品质等级各4个并覆盖不同时延；24 ID、24 OOD均不参与训练或选模。36个新教师每个训练6,144,000次转移；三个学生各完成BC30 epoch与6次真实DAgger采集、每次8 epoch，保留全部源教师，最终每种子聚合1,075,200个状态。教师有12维特权输入；学生仅有176维公共参考与测量历史输入。新PPO奖励和历史显式采用same_time，旧区间口径仍保留供归档复现。
    - paragraph [ref=e4125]: 训练/验证/测试分别为32/16/18条互不重复的实际波形。教师以源对象独立验证指令在2.00–7.98 s窗口的平均RMSE选权重；学生以全响应源验证RMSE选轮次。正式测试从指令开始到真实末状态，二者不混报。以下门限为项目RMSE/Peak/TV联合通过条件，不是完整GJB品质评定。
