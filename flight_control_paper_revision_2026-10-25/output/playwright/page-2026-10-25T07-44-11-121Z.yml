    - paragraph [ref=e726]: 教师另接收 12 维特权量 z_t（8 个对象参数与 4 个对象内部状态），构成 188 维输入；学生不直接接收 z_t，但归档 176 维输入中的参考仍依赖 τp。因此只能称去掉显式特权向量，不能称全链路无对象参数。公共参考修订消除了这条依赖；传感器估计、执行机构内部量的获得方式仍需在实际部署接口中定义。
    - paragraph [ref=e727]: 本文区分对象参数 θ 与控制器权重 w：前者决定仿真对象的动态，后者决定根据观测采取什么动作。教师训练中，单个专用教师对应的 θ 固定，优化器更新 w；统一学生随后学习多个教师的行为。p 是机体系滚转角速度，φ 是倾斜角；仅在简化纯滚转条件下可用 φ̇≈p，不能在一般耦合运动中直接等同。
