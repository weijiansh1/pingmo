    - heading "3.1.2 联合覆盖和边界的构造定义" [level=4] [ref=e1627]
    - paragraph [ref=e1628]: 以四个分量标签 (g_TR,g_spiral,g_Dutch,g_S) 建立 3×3×3×2=54 格诊断网格。该网格检查采样是否遗漏联合退化，既不表示真实机队应均匀分布，也不保证每格都对应可实现的飞机。已知困难对象不因原始品质较差而自动删除；应另行记录控制权限和任务可达性。
    - paragraph [ref=e1629]: 新构造样例在每个格内随机取参数，并对正阈值 b 构造成对 θ⁻、θ⁺，令目标指标分别位于 0.98b 和 1.02b，同时检查该阈值在其余条件下确实引起分级变化。训练、验证和 ID 测试使用不同参数向量。荷兰滚二级覆盖频率不足、阻尼不足和乘积不足的分支，运输延迟研究范围覆盖至 0.25 s。真实覆盖计数与尚未完成的步骤见第 6.6 节。
