    - paragraph [ref=e1154]: 矩阵乘法表示状态之间以及输入到状态的线性组合；延迟队列、执行机构和等效输入扰动由环境另外推进。每个控制步包含 20 个对象步。当前初始滚转偏差按 Cx=p₀ 的最小范数实现状态设置，不能解释成真实飞机其余物理状态都为零。
    - paragraph [ref=e1155]: 单个滚转模态含 exp(−t/T_R)，欠阻尼荷兰滚模态可写为 exp(−ζ_dω_dt) 乘正弦或余弦。后者包络由 ζω 乘积决定，实际振荡角频率为 ω_d√(1−ζ_d²)。分子零点和模态系数决定这些分量在 p 上出现多强；因此“阻尼较好”与“整段滚转响应无明显振荡”并非同一个判定。全部参数组合能否嵌入真实飞机的物理模型尚未证明。
    - paragraph [ref=e1156]:
      - text: GJB 原文使用的驾驶杆力 F_as→p 与本实验的速率指令 p_cmd→闭环 p 是不同映射。若未来从实际驾驶操纵记录辨识对象，其 LOES 可能已包含原飞控和执行机构，新增控制环之前必须核清边界
      - superscript [ref=e1157]: "[25]"
      - text: 。目前等效 N 输入及另加执行机构属于研究接口约定。
