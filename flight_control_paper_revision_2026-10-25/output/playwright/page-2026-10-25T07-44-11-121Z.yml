    - heading "6 讨论" [level=2] [ref=e3769]
    - paragraph [ref=e3770]: 归档源域结果报告，49 个逐对象教师中多数达到项目门限；然而统一学生的 RMSE 中位数仍高于对应教师，且 4 个留出对象中仅 3 个通过。120 对象扩展抽样的通过率为 78.3%，幅值扫描则显示，±31 deg/s 阶跃通过率从同分布样本的 60.3% 降至 OOD 样本的 27.6%。在所选固定增益 PID 的对照中，学生策略在分布外对象上的退化幅度较小，但在同分布小幅值段的精度不及经过前馈整定的 PID。这些结果共同表明，蒸馏能够将策略压缩至数千参数并保留大部分常规响应能力，但学生策略对对象参数和指令幅值仍敏感。
    - paragraph [ref=e3771]: DHC-6 的归档适配数字来自两个不同规模的学生。small 的适配组改善大于留出组，tiny 的适配后误差也高于 small；这提示当前容量和更新配方可能影响目标域适配，但不构成容量或预训练收益的独立因果证据。目标对象来自 DHC-6 仿真记录的 ARX 辨识模型，未验证完整横航向耦合、状态估计误差或实际控制器接机。原 small 结果没有这些受控对照；第 6.5 节另对新的 3,856 参数学生补齐同预算随机初始化与冻结策略比较，不能归为旧 small 实验的复现。
    - paragraph [ref=e3772]: 飞行品质在本工作中用于源域参数化、覆盖设计和部分事后评价。归档奖励没有逐项加入 GJB 条款，因此当前可支持“在飞行品质相关参数化对象上训练控制器”，不能支持“已用 GJB 品质指标直接优化并证明符合性”。
    - heading "6.1 延迟表征与等效延迟的核验" [level=3] [ref=e3773]
    - heading "6.1.1 数据与输入条件" [level=4] [ref=e3774]
    - paragraph [ref=e3775]: 归档 SAE 分支使用 510 个对象：训练/验证/测试分别为 300/90/120 个，每组在短（τp≤0.05 s）、中（0.05<τp≤0.15 s）、长（τp>0.15 s）时延层均分。每对象运行六档正阶跃（1、2、5、10、21、31 deg/s）、双脉冲、多正弦，共八条指令，产生 489,600 个历史窗口。这里不是主线正负六档的十四指令扫描。
    - paragraph [ref=e3776]: 本次用原 tiny 权重及 legacy_plant 参考重建全部对象，检查对象清单相同、4,080 个对象—指令的通过/失败判定没有变化。跨平台数值差异的最大 RMSE 为 0.00063 deg/s，峰值差约 0.00283 deg/s，TV 差约 0.00094 N/s。重建数据保留为独立版本，不覆盖归档数据。测试对象与训练对象分离，但其行为策略来自已有 tiny，不能将整个项目所有历史暴露等同于此处对象划分。
    - paragraph [ref=e3777]: SAE 将 160 维展平历史编码为 16 维；PCA、稠密 AE、稀疏 AE、原始历史和互相关作为对照。互相关使用请求力、响应和指令，不直接读取参考信号，但产生轨迹的策略在归档模式下使用对象相关参考。探针成绩是当前仿真与行为策略中的可解码性，不是闭环改善或参数完全可辨识的证明。
    - paragraph [ref=e3778]:
      - img "图 16，数据与限制见下方图注"
    - paragraph [ref=e3779]:
      - emphasis [ref=e3780]: 图 16 原始历史与冻结表示的结构。编码器是否可训练、初始化以及参考构造均是实验条件，不能仅因输出同为 16 维就认为容量完全一致。
    - heading "6.1.2 严格时间截止后的延迟探针" [level=4] [ref=e3781]
    - paragraph [ref=e3782]: 原脚本把 1.2 s 的决策步 60 强制抬到首个后续记录步 61，实际使用了 1.22 s 的样本。因此撤回原 0.995/2.9 ms 作为“1.2 s 因果结果”的表述。修订后从 1.0 s 指令起始时刻累积历史窗口，严格要求窗口时间不超过查询时间；1.2 s 查询的最新可用记录为 1.16 s。统计窗的起点也明确为 1.0 s，不能把新旧分数之差全部解释成单独 20 ms 的作用。
    - paragraph [ref=e3783]: 重建数据、原冻结编码器和按对象划分的训练/验证/测试用于重新拟合线性探针。结果如下，R² 与 MAE 均在 120 个测试对象、960 个对象—指令 episode 上统计。
