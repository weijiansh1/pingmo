    - paragraph [ref=e4252]: 考虑延迟后，全部对象的建库窗口都不足一个完整荷兰滚周期。GJB 正文 3.6 要求有符号峰谷，并按 ζ_d≤0.2 与 ζ_d>0.2 使用不同极值公式；缺峰或未处理螺旋分量时不能补零认定无振荡。调节时间须定义目标、容差及最短保持时间，未证实时记为截断。当前可先用滚转时域超调、残余 RMS、恢复包络及饱和/发散率评价抑振，不能据此伪造含侧滑相位条件的完整等级。
    - paragraph [ref=e4253]: 500 个 OOD 中，160 个仅因 L_Fa 超出研究范围；OOD 不自动表示品质更差。旧 R_ω 域外采样在二分支内未重新缩放随机变量，实际范围约为 [0.30,0.424] 与 [2.121,3.0]，不同于名义区间。后续 OOD 协议应明确越界原因和采样规则，不能将这一问题隐入总通过率。
