    - paragraph [ref=e2864]: "原稿报告每个对象训练 30 轮，每轮由 512 个并行环境各运行 400 个策略步，累计约 614 万个状态转移；第 6.5 节另以 12 对象×3 种子执行同等单教师预算，不替代原 49 教师记录。Actor 与 Critic 使用 Adam，学习率为 3×10^{−4}。"
    - paragraph [ref=e2865]: ρ 是同一连续动作在新旧策略下的概率密度比；clip 作用于代理目标的该比值，不是把物理动作改变限制为 20%，也不强制所有比值永远处于 [0.8,1.2]。对正优势样本，增加其密度能改善目标，但超过裁剪端后不再获得同样的收益。策略梯度与价值损失用于调整网络权重，控制周期内的动作计算只执行网络前向。第 6.5 节每批最多更新 5 遍、小批次 16,384，近似 KL 超过 0.03 时停止本批更新；梯度范数上限 0.5 与执行机构的 88 N/s 限速是不同约束。
    - heading "3.2.3 奖励与品质维度的对应" [level=4] [ref=e2866]
    - paragraph [ref=e2867]: 奖励三项是响应跟踪、操纵能量和力速率幅值的代理代价；没有建立它们与 GJB 条款逐项等价的关系。品质相关参数用于源域对象构造，训练后用项目定义的 RMSE、Peak、TV 门限准入。LOES 等效延迟另作事后分析，不等同于直接以 GJB 品质指标训练。
