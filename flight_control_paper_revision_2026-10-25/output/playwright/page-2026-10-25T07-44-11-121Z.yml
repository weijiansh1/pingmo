    - paragraph [ref=e3269]: 逐轮加入学生访问状态，使训练分布逐步覆盖学生自身闭环行为诱导的状态，而不是只拟合教师访问过的状态。
    - paragraph [ref=e3270]: 第 6.5 节的实际实现先做 30 个 epoch 的 BC，再执行 6 次新的闭环采集，每次在全部聚合数据上训练 8 个 epoch。执行教师动作的概率依次为 0.5、0.25、0、0、0、0；后四轮由学生执行，仍由教师提供标签。每个种子累计七批、共 1,075,200 个状态。采集轮次改变访问分布，epoch 表示重复使用已有数据，两者不能混称。模型按源域独立验证表现选取，最终测试集不参与选轮次。
    - paragraph [ref=e3271]: 均方动作损失也有信息条件：若相同学生观测及历史对应不同特权状态和相反教师动作，平方损失倾向于条件平均，并不保证每种隐藏状态下的动作都正确。因此压缩规模、特权信息落差、历史长度和教师质量需分别检验。附录 A 给出损失与误差传播的算例；这些算例不代替真实闭环结果。
    - paragraph [ref=e3272]:
      - img "图 3，数据与限制见下方图注"
    - paragraph [ref=e3273]:
      - emphasis [ref=e3274]: 图 3 学生策略的同构张量：输入仍是 32×5 历史，去掉显式特权量后的拼接维为 32 维（16+9+7），主干只有 1 个 32 宽残差块，共 3,856 参数。延迟表征实验的 SAE 分支见图 16。
    - heading "3.4 第四步：DHC-6 仿真数据小样本微调" [level=3] [ref=e3275]
    - paragraph [ref=e3276]: 目标域数据包含 12 个 DHC-6 仿真配平状态和 72 条 50 Hz 输入输出记录。依据 chirp 激励辨识各状态下的 ARX 模型，阶次范围为 na = 4–5、nb = 3–4、nk = 1，拟合 VAF 为 98.0%–98.7%。接口将策略输出的力速率积分为受 ±22 N 限幅的请求力，再按 δ = −(10/22)F 映射为副翼偏角；辨识模型输出的滚转角速度作为策略输入。
    - paragraph [ref=e3277]: "微调更新 75,040 参数 small 学生的全部权重。8 个状态用于适配，4 个状态留出用于检验跨状态泛化。优化执行 40 次 Adam 更新，学习率为 3×10^{−5}；训练损失统计响应开始 2 s 后的跟踪平方误差。闭环评估采用确定性策略、15 deg/s 正阶跃和 8 s 时域。"
