      - text: ：训练、验证、ID 各 54 个联合组合，另有 14 组、28 个距活动阈值 ±2% 的边界探针；其中 138 个同时退化至少两项，44 个为高频二级荷兰滚，39 个位于 0.20–0.25 s 延迟段。
