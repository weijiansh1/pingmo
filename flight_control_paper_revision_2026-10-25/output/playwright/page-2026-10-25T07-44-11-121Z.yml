      - img "图 12，数据与限制见下方图注"
    - paragraph [ref=e3698]:
      - emphasis [ref=e3699]: 图 12 同一 tiny 学生在三个源域对象和三类指令下的闭环响应。行表示品质等级，列表示指令；虚线为参考，实线为学生。
    - paragraph [ref=e3700]: 图 12 展示固定对象 train_core-0000、train_core-0421 和 train_core-0701 在正、负阶跃及多正弦指令下的响应。三个对象的瞬态跟踪差异可见。
    - heading "5.3.3 指令幅值与分布外对象评估" [level=3] [ref=e3701]
    - paragraph [ref=e3702]: 进一步评估学生在不同指令幅值及分布外对象上的表现。按品质等级从 4,500 个非分布外对象中抽取 300 个（每级 100 个），并纳入全部 500 个分布外对象；对每个对象测试 ±1、±2、±5、±10、±21 和 ±31 deg/s 六档阶跃、一个双脉冲及一个多正弦，共 11,200 个对象—指令组合。每一组合在仿真中重复两次，共运行 22,400 条轨迹；统计按脚本导出的组合级结果计算。三项门限与前文一致。
    - paragraph [ref=e3703]: 同分布样本中，±1 deg/s 阶跃通过率为 99.7%，RMSE 中位数为 0.11 deg/s；±31 deg/s 阶跃通过率为 60.3%，RMSE 中位数为 1.13 deg/s。双脉冲和多正弦通过率分别为 99.0% 和 99.7%。通过率随幅值增加而下降，大幅值段的请求力限幅（±22 N）和动作速率限制（88 N/s）可能参与约束响应。现有幅值比较未独立改变执行机构边界，尚不能确定饱和与其他误差来源各自的贡献。
    - paragraph [ref=e3704]: 在 500 个分布外对象上，±1 deg/s 和 ±31 deg/s 阶跃的通过率分别为 86.8% 和 27.6%，对应 RMSE 中位数为 0.21 和 2.93 deg/s。该结果表明，当前小型学生在较大幅值及分布外参数组合下性能下降明显。幅值测试中的 300 个同分布对象与前述 48 对象学生评估集不重叠；该测试评估的是固定学生策略，不包含目标域微调。
    - paragraph [ref=e3705]:
      - img "图 13，数据与限制见下方图注"
    - paragraph [ref=e3706]:
      - emphasis [ref=e3707]: 图 13 学生响应随指令幅值的变化。蓝为 300 架同分布对象，红为 500 架分布外对象；(a) 中位误差与四分位带（虚线为门限），(b) 三门槛通过率。
    - heading "5.3.4 与固定增益 PID 的对照" [level=3] [ref=e3708]
    - paragraph [ref=e3709]: 为判断上述边界是否是“学习控制器特有”，在同一批对象（300 同分布 + 500 分布外）和同一批指令上 运行一个经典基线：二阶自由度 PID，含参考前馈、抗积分饱和，输入为力请求（±22 N），再折算成同一 力速率接口。增益在对象 train_core-0421 上做网格搜索得到（k_p=128、k_i=60、 k_d=0.8、k_ff=6.0），此后不再调整，即无增益调度。学生使用多对象训练，而该 PID 仅在一个对象整定，因此本对照只支持相对于这套固定 PID 的结果，不能代表相同对象族联合整定或增益调度方法的最优性能。
    - paragraph [ref=e3710]: 按同一门限判定，学生在所列幅值组的汇总通过率更高：同分布 ±1 为 99.7% 对 80.0%，±31 为 60.3% 对 35.7%； 分布外差距更大，±1 为 86.8% 对 46.6%，±31 为 27.6% 对 16.2%。PID 的零样本失效集中在分布外对象： 分布外各幅值组的中位 RMSE 为 8.8–18.5 deg/s，学生在同一批对象上为 0.21–2.93 deg/s。小幅值段 PID 的中位误差更低 （0.06 对 0.11），但其峰值与力变化率越界，因此门限通过率反而更低——两者在“精度”与“合格”上不是同一口径。
    - paragraph [ref=e3711]: 本对照说明所选固定 PID 与已训练学生在当前对象族中的差异，不能推出常规控制器必然需要逐对象整定，也未验证学生在实际跨机型部署中免于接口标定或再训练。
    - heading "5.4 第四步：DHC-6 仿真目标上的小样本微调（归档报告值）" [level=3] [ref=e3712]
    - paragraph [ref=e3713]: 在归档的 15 deg/s 正阶跃、8 s 时域及 ARX 目标模型下，small 的八个适配状态 RMSE 中位数由 2.913 降至 0.595 deg/s，四个留出状态由 2.662 降至 2.148 deg/s，分别降低 79.6% 与 19.3%。后者描述当前留出状态上的改善，不代表实机或其他指令条件的泛化。
    - paragraph [ref=e3714]: tiny 适配后中位误差为 1.574 deg/s，small 为 0.595 deg/s，前者约为后者的 2.65 倍。但源域初始化性能、网络容量和优化过程未独立控制，不能由此确定“源域容量无关、目标域容量敏感”的分工，更不能直接给出不同规模模型的部署建议。每状态五次更新只是原稿 40 步循环访问八状态的预算说明；尚无增加步数的受控实验来证明其必然改善性能。
    - paragraph [ref=e3715]: 本包缺少该 small 模型及 40 步主线的完整原始记录。表 4—5 与图 14—15 保留为归档报告，待原始证据补齐后核验；不使用同包另一模型的 64 步旧协议替代。
