  - main [ref=e117]:
    - heading "基于飞行品质模型的飞控大模型研究" [level=1] [ref=e118]
    - blockquote [ref=e119]:
      - paragraph [ref=e120]: 论文整合修订版 · 2026-10-25 · 纳入 GJB 原文核查、对象库覆盖审计及数学说明；本次未新增策略训练
    - heading "摘要" [level=2] [ref=e121]
    - paragraph [ref=e122]: 本文研究飞控控制器的构建路线：按飞行品质相关参数组织源域对象、训练专用教师、蒸馏统一学生并进行目标域适配。现阶段以滚转通道开展路线可行性验证。归档主线构造 5,000 个参数化对象，报告 49 个 PPO 教师中 46 个通过项目门限，及 tiny（3,856 参数）和 small（75,040 参数）两种学生。tiny 相对教师的 RMSE 中位倍数为同分布 1.28、四对象留出 1.68；small 为 1.34、1.41。上述结果存在精度损失，不能证明容量无关或把差距归因于特权信息。300 个同分布对象的 ±1/±31 deg/s 通过率为 99.7%/60.3%，500 个 OOD 对象为 86.8%/27.6%。DHC-6 仿真辨识对象上的 small 适配组中位误差由 2.913 降至 0.595 deg/s，留出组由 2.662 降至 2.148 deg/s；这些主线数值保留为归档报告值，完整原始证据未随包提供。
    - paragraph [ref=e123]: 2026-10-24 的路线验证在训练前固定 12 个源对象、24 个 ID 留出对象、24 个 OOD 对象及三个策略种子，实际训练 36 个教师与三个统一学生。8 s 独立指令测试中，教师源对象通过率为 61.1%–82.4%，学生为 48.1%–87.0%；学生 ID 为 40.7%–68.1%，OOD 为 38.9%–51.4%。同源蒸馏在一个种子下降约 13 个百分点，30 s 测试出现六次学生发散，因此不能概括为可靠无损或长时稳定。等目标预算的 DHC-6 ARX 对照中，三个种子预训练后适配的留出通过率为 75.0%/75.0%/80.6%，从零为 58.3%/63.9%/61.1%，支持当前辨识仿真和配方下的预训练收益。详见第 6.5 节。
    - paragraph [ref=e124]: 此前修订核对并重建了 510 对象的 SAE 数据，修复学生参考对真实时延的依赖、跨时延更新中的样本回流，以及探针和频响评价的时间问题。在严格 1.2 s 截止下，互相关时延探针 R²=0.984、MAE=5.6 ms。对归档频响修正 20 ms 时间偏差并重新拟合后，raw/SAE-aux 的可评对象分别为 73/101 个，中位等效延迟为 0.093/0.125 s，Top-k 为 0/120 可评。另补固定公共参考对照和两种策略种子的训练范围受限实验。结论限定于所述仿真对象、输入条件与项目门限，不等同于实飞验证或 GJB 符合性评价。
    - paragraph [ref=e125]: 补充的对象库审计发现，4,500 个非 OOD 对象仅覆盖 8 种已实现判据的等级组合，全库不存在两项及以上已分级指标同时退化的对象。0.75 s 建库记录不足以支持旧辅助振荡比和调节时间的品质解释。本文据此限定源域覆盖与指标适用范围，并提供覆盖 54 种分量等级组合和 14 组活动阈值边界的 190 对象构造样例；该样例仅完成构造与数值验证，尚未用于控制器训练。数学方法在第 2—3 节展开，代数算例见附录 A。
    - paragraph [ref=e126]:
      - strong [ref=e127]: 关键词：
      - text: 飞行品质；低阶等效系统；强化学习；教师—学生蒸馏；交互式模仿；迁移学习
    - heading "1 引言" [level=2] [ref=e128]
    - paragraph [ref=e129]: “品模”项目以飞控控制器为研究核心，探索跨对象共享策略的构建与适配路线。滚转角速度内回路是现阶段的可行性验证任务，DHC-6 仿真辨识对象用于检验目标域适配。指令跟踪、指令引起的振荡以及扰动或初始偏差引起的振荡属于该验证任务的评价内容。全通道、耦合和实机验证是后续扩展；当前重点是教师、蒸馏学生及新对象适配各环节的结果是否可靠。教师约 4.26 M 参数，源域 tiny 学生为 3,856 参数；文中较好的目标域适配数字属于 75,040 参数 small，不能合并成同一规模模型的成绩。
    - paragraph [ref=e130]: 流程包括品质相关参数分层采样、逐对象教师、统一学生蒸馏和目标域微调。飞行品质标准指导对象构造及部分事后评价；RMSE、峰值误差、操纵总变差率的准入门限由项目另行定义。归档奖励由跟踪误差、作用力能量与力速率动作幅值组成，尚未直接优化全部 GJB 条款，也未证明品质分层优于相同预算的一般参数采样。
    - paragraph [ref=e131]: 本修订版区分三类证据：第 3—5 节主线的归档报告值；第 6.1 节可由随包数据或重建数据核对的结果；第 6.2 节新增的受控对照。第 6.4 节另列品模与 PPO 实现深查，发现并修复一秒灵敏度时间偏移、动作概率不一致及回合末值语义问题；其小规模训练仅验证实现流程。归档教师、六轮蒸馏、幅值扫描及 small 迁移的完整记录缺失，不能把同名旧实验摘要当作本版原始证据。第 6.5 节列出 controller-route-v1 的独立三种子实验，第 6.6 节是 2026-10-25 并入论文的对象库审计，不包含新策略训练。版本对应关系见修订说明。
    - heading "1.1 相关工作" [level=3] [ref=e132]
    - paragraph [ref=e133]:
      - text: 飞行品质与学习控制。飞行品质规范及低阶等效系统为对象参数化和响应评价提供依据
      - superscript [ref=e134]: "[1,2,13]"
      - text: 。Jansen 与 van Kampen 研究 SAC 飞控的纵向操纵品质评价
      - superscript [ref=e135]: "[16]"
      - text: ，是强化学习与航空品质评价的直接相关工作；本次仅核到其摘要、首页与部分引言，不引申未读到的实验细节。Bøhn 等在固定翼姿态控制中研究 SAC 的仿真到实飞迁移，强调延迟与动力学随机化
      - superscript [ref=e136]: "[17]"
      - text: 。本项目当前验证范围为滚转参数化对象和 DHC-6 仿真辨识对象。
    - paragraph [ref=e137]:
      - text: 特权信息与蒸馏。LUPI 与广义蒸馏允许教师、学生拥有不同信息
      - superscript [ref=e138]: "[5,18]"
      - text: ；这与单纯缩小网络容量是两个变量。Asymmetric actor–critic 让 critic 使用完整状态、actor 使用部署观测
      - superscript [ref=e139]: "[6]"
      - text: ，并不必然需要两阶段教师—学生蒸馏。足式机器人特权学习、RMA 以及航空 Extreme Adaptation 展示了利用历史或潜变量进行动力学适应的路线
      - superscript [ref=e140]: "[7–9,15]"
      - text: ，但“信息能够读出”仍不能替代闭环收益的验证。
    - paragraph [ref=e141]:
      - text: 通用飞控策略。RAPTOR 通过 1,000 个专用 RL 教师训练统一的 2,084 参数循环学生，并在多个真实四旋翼上验证
      - superscript [ref=e142]: "[14]"
      - text: ，与本项目多教师到小型通用策略的链路最接近。其相关工作进一步连接 Extreme Adaptation、One Net to Rule Them All、Learning by Cheating、RMA、A-NC 和 DAgger。比较时需要对齐控制层级、动力学覆盖、部署输入和实机证据。竞速飞行
      - superscript [ref=e143]: "[11]"
      - text: 、Neural-Fly 抗风适应
      - superscript [ref=e144]: "[10]"
      - text: 和 Learning to Fly in Seconds
      - superscript [ref=e145]: "[12]"
      - text: 分别提供不同任务和训练范式的参照，不能概括成所有工作都只面向单一平台。
    - paragraph [ref=e146]:
      - text: 多教师与多轮更新。Policy Distillation 研究将策略知识转移到统一学生
      - superscript [ref=e147]: "[19]"
      - text: ；DAgger 在学生访问状态上追加专家标签
      - superscript [ref=e148]: "[4]"
      - text: 。Distilling Policy Distillation 强调采样分布和更新目标的区别
      - superscript [ref=e149]: "[20]"
      - text: 。反复采集、网络训练 epoch、多代学生成为教师以及多教师合并是不同概念；Born Again Networks 和 Teacher Assistant KD 分别提供多代与分级蒸馏参照
      - superscript [ref=e150]: "[21,22]"
      - text: ，不能据此推定飞控品质随轮数单调改善。RAPTOR 的当前策略采样变体也不应直接写成原始 DAgger 的完整历史数据聚合。
    - paragraph [ref=e151]: 本文考察“品质相关对象族→专用教师→统一学生→新对象适配”的飞控控制器构建路线，在滚转任务中检验其可行性和失效边界。当前需要核验教师学习、学生能力保留及新对象泛化与适配的连续证据。品质分层采样的独立收益和特权信息作用还需受控比较；真实固定翼跨机型部署属于后续验证范围。
    - paragraph [ref=e152]:
      - text: 关于对象的物理解释，Davidson 与 Andrisani 将特征向量与滚转、侧滑响应的传递函数联系起来
      - superscript [ref=e153]: "[24]"
      - text: ，说明仅给定模态阻尼和频率仍不足以确定输出中的振荡幅度。Morelli 的 LOES 辨识以驾驶操纵为输入、飞机响应为输出，模型包含机体与控制系统总效应
      - superscript [ref=e154]: "[25]"
      - text: 。因此本研究使用参数化对象时必须声明控制边界；教师与学生接入后形成的新闭环，需要按自己的输入输出重新评价。
    - heading "2 问题定义与控制对象" [level=2] [ref=e155]
    - heading "2.1 控制任务与接口变量" [level=3] [ref=e156]
    - paragraph [ref=e157]: 被控量为滚转角速度 p，外部任务给定指令 p_cmd。归档训练环境以二阶参考模型和对象真实时延 τp 生成 p_ref；因此该参考不是仅由指令决定。修订代码默认采用不读取对象参数的公共参考，旧实验通过 legacy_plant 模式显式保留。PPO 策略使用 p_ref 及其他闭环量构成观测，并以 e_t = p_ref,t − p_t 计算跟踪误差。
