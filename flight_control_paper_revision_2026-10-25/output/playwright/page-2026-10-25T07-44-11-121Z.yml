    - paragraph [ref=e4671]: 若 r=−0.1、γ=0.995，Critic 对当前与下一状态的预测分别为 −5 和 −4，则 δ=−0.1+0.995×(−4)−(−5)=0.92。结果比预期好时，差值可为正，而即时奖励仍为负。GAE 加权汇集这些差值来估计优势。
    - paragraph [ref=e4672]: 对正优势 Â=2 的样本，ρ=1.1 时式 (9) 中被取负前的贡献为 2.2；ρ=1.4 时裁剪分支为 1.2×2=2.4，min 选择 2.4，而非 2.8。这限制特定方向上继续改变该样本密度的激励，并非稳定性证明。
    - paragraph [ref=e4673]: 优化器用损失对权重的导数决定调整方向。最简单的梯度下降写成 w_new=w−η∇_wL：η 为学习率，∇_wL 表示各权重微小改变对损失的局部影响；实际程序用 Adam。调整 w 的训练过程，与每 20 ms 输入观测得到动作的部署过程不同。
