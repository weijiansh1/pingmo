    - heading "5.3 统一策略的知识汇聚与跨对象控制" [level=3] [ref=e3971]
    - paragraph [ref=e3972]: 多轮 DAgger 将逐对象教师经验汇聚到一组共享权重中。图 7 显示，学生与教师的误差比从初始行为克隆时的数十倍下降到后期约 1.3。tiny 学生以 3,856 个参数在 44 个蒸馏源对象中通过 37 个，在 4 个留出对象中通过 3 个。
    - figure "图 7 DAgger 轮次与师生闭环跟踪误差比。第 0 轮为行为克隆，随后在学生访问状态上追加教师标签。" [ref=e3973]:
