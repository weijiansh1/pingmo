  - main [ref=e34]:
    - heading "基于飞行品质的飞控大模型构建与滚转通道验证" [level=1] [ref=e35]
    - generic [ref=e36]: 研究论文 · 版本日期：2026-10-24
    - generic [ref=e37]: 摘要 将飞行品质的统一动态描述转化为可跨对象复用的控制知识，是飞控大模型的关键任务。本文提出基于飞行品质的飞控大模型构建路线，并以滚转通道开展验证。通过飞行品质相关参数构造 5,000 个对象，从中选取 50 个训练特权 PPO 教师，再经多轮 DAgger 将逐对象控制经验汇聚为统一策略。蒸馏得到的 tiny 学生含 3,856 个参数，在 44 个蒸馏源对象上相对教师的跟踪 RMSE 中位比为 1.28。面向 500 个分布外对象的 ±1 deg/s 阶跃测试，统一学生通过率为 86.8%，体现了统一策略的跨对象复用能力。目标域采用 75,040 参数的 small 学生，在 DHC-6 辨识模型上经 40 次参数更新，适配状态的 RMSE 中位数由 2.91 降至 0.59 deg/s，留出状态由 2.66 降至 2.15 deg/s。上述结果形成了从品质对象族、专用教师到统一控制策略及目标域适配的滚转通道验证链。
    - generic [ref=e38]: 关键词 飞行品质；飞控大模型；特权强化学习；多教师蒸馏；DAgger；迁移学习
    - heading "1引言" [level=2] [ref=e39]
    - paragraph [ref=e40]: 面向不同对象复用控制经验，是飞控大模型需要解决的核心问题。飞机的操纵效能、模态阻尼、响应时间和输入时延随对象及状态变化，控制策略需要在这些差异下维持指令跟踪与振荡抑制能力。飞行品质以响应特征描述对象动态，为组织跨对象控制学习提供了统一的参数基础。
    - paragraph [ref=e41]: 本文据此构建“品质对象族—特权强化学习教师—多轮蒸馏统一策略—目标域适配”的方法链。对象族为学习提供具有明确动态含义的任务分布；逐对象教师形成控制经验；蒸馏将这些经验汇聚到共享策略中，使部署控制器依靠常规观测和历史响应完成反馈控制。目标域适配进一步将共享策略连接到具体机型的辨识模型。
    - paragraph [ref=e42]: 滚转角速度通道用于验证这条构建路线。研究依次回答三个问题：品质参数化对象能否支撑有效教师训练，多对象教师的能力能否由统一策略保留，以及该策略如何随对象变化并通过小样本更新适配目标模型。评价采用同对象教师—学生对照、专用教师跨对象控制、统一学生对象覆盖及 DHC-6 仿真适配，围绕飞控大模型的知识形成、汇聚和复用展开。
    - heading "1.1 相关工作" [level=3] [ref=e43]
    - paragraph [ref=e44]: 飞行品质与低阶等效模型。飞行品质规范以响应模态和等效参数描述控制对象的动态特征，并给出相应分级判据 [1,2]。这些参数使不同对象的响应差异能够在同一坐标中表达。本文利用这一特点构造学习对象族，以操纵效能、模态参数和时延组织训练与测试。
    - paragraph [ref=e45]: 特权学习与教师—学生蒸馏。特权学习利用训练阶段可获得的信息辅助策略学习 [5]；非对称 actor–critic、教师—学生控制及运动自适应研究从不同角度处理训练信息与部署观测之间的差异 [6–9]。本文采用逐对象特权教师学习控制策略，再将多位教师的动作知识蒸馏到使用常规观测与历史响应的统一学生中。
    - paragraph [ref=e46]: 学习飞行控制与目标域适配。竞速无人机、强风环境控制及 Learning-to-Fly 等研究展示了学习策略在飞行任务中的应用 [10–12]。本文关注飞控策略的跨对象构建：先在品质参数化对象族上积累控制经验，再以 DHC-6 仿真辨识模型检验共享策略的小样本适配。
    - paragraph [ref=e47]: 本文的方法特点在于，以飞行品质组织控制学习的对象空间，通过专用教师积累控制经验，再以多轮蒸馏实现经验汇聚。滚转验证围绕统一策略的能力保留、跨对象复用、历史表征及目标域更新建立证据，形成飞控大模型构建路线的完整论证。
