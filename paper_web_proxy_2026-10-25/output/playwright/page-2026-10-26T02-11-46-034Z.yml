    - paragraph [ref=e3976]: 两档学生的参数规模、达标数和师生闭环跟踪误差比见表 5。tiny 与 small 的源对象误差比分别为 1.28、1.34，留出对象误差比分别为 1.68、1.41。两档实现提供了不同的参数规模与相对跟踪精度组合。
