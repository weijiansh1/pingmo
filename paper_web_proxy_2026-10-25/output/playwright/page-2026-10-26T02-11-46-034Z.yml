    - paragraph [ref=e1030]: 图 1 展示源域学生闭环仿真及响应曲线的生成过程。品质参数确定对象模型后，学生每 20 ms 根据观测和历史输出动作，经力接口与执行机构形成控制输入；仿真器以 1 ms 步长推进对象状态，并将新的角速度反馈至策略。按时间记录角速度与操纵量，即得到后文的时域响应。每条轨迹对应一组固定对象参数与固定策略权重。
