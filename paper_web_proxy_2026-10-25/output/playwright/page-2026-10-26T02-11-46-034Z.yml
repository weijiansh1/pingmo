    - heading "3 基于飞行品质的飞控大模型构建方法" [level=2] [ref=e1874]
    - paragraph [ref=e1875]: 基于飞行品质的飞控大模型通过对象组织、控制经验学习与知识汇聚形成共享策略，构建关系如图 2 所示。品质参数化将对象动态差异转为学习任务，特权教师在各任务上形成反馈控制经验，多轮蒸馏将这些经验汇聚为依靠常规观测运行的统一学生。目标域适配利用具体机型的仿真数据更新共享策略，实现控制知识在目标模型上的复用。
    - figure "图 2 飞控大模型的构建与验证流程：品质对象族、特权 PPO 教师、多轮蒸馏与目标域适配。tiny 与 small 学生分别含 3,856 和 75,040 个参数；40 次目标域更新及 2.91→0.59 deg/s 的结果对应 small。" [ref=e1876]:
