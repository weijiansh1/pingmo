    - paragraph [ref=e3543]: 多轮聚合在学生访问的状态上持续追加教师标签，扩展训练样本的状态覆盖。训练中的动作均方误差约束师生动作差异；蒸馏后的控制能力通过冻结权重的闭环测试评价，指标见第 2.3 节。
    - figure "图 4 学生策略的同构张量：输入仍是 32×5 历史，拼接维去掉 π 后为 32 维（16+9+7），主干只有 1 个 32 宽残差块，共 3,856 参数。" [ref=e3544]:
      - img "图 4 学生策略的同构张量：输入仍是 32×5 历史，拼接维去掉 π 后为 32 维（16+9+7），主干只有 1 个 32 宽残差块，共 3,856 参数。" [ref=e3545]
    - heading "3.3.1 历史表征与稀疏编码对照" [level=4] [ref=e3547]
    - paragraph [ref=e3548]: 多教师蒸馏同时包含两种变化：将多个对象的控制经验合并到一套权重，并撤去教师使用的对象参数和内部状态。部署学生因而需要利用可观测的输入—响应历史区分对象动态。基线学生将 32×5 历史送入随控制任务联合训练的时序编码器，得到 16 维历史特征。历史中的对象信息能否被有效利用，是统一控制器输入设计需要检验的问题。
    - paragraph [ref=e3549]: 为检验显式表征学习能否改善对象动态信息的提取，设置 PCA、稠密自编码器和稀疏自编码器（SAE）前端对照。SAE 检验少数活跃特征能否集中保留对象动态线索，稠密编码用于比较稀疏约束的影响。SAE 采用 160→64→16 编码器和对称解码器，以 L1 或 top-k 约束限制潜码中的活跃分量。替换分支用冻结前端输出的 16 维特征替代基线时序特征；辅助分支在保留基线特征时再附加 SAE 潜码。各替换前端的历史特征维度均为 16，用于比较不同表征学习方式。
    - paragraph [ref=e3550]:
      - text: 评价分为信息读出和闭环控制两步：以对象输入运输时延
      - generic [ref=e3552]:
        - math [ref=e3554]:
          - generic [ref=e3557]:
            - generic [ref=e3558]: τ
            - generic [ref=e3559]: p
        - generic [ref=e3562]:
          - text: τ
          - generic [ref=e3563]: p
      - text: 为标签，检验因果历史中能否读出对象动态线索；再将相同表征接入策略，比较跟踪与恢复过程。探针和控制结果共同用于判断输入设计。该消融在既有 tiny 学生上进行，动作标签由该学生产生；原始历史与辅助输入分支继承其权重，替换分支训练新的策略头。完整网络和训练设置见
      - link "附录 A.1" [ref=e3572] [cursor=pointer]:
        - /url: "#s611"
      - text: 。
    - heading "3.4 目标域小样本适配" [level=3] [ref=e3573]
    - paragraph [ref=e3574]:
      - text: 目标域采用 12 个 DHC-6 仿真配平状态的 72 条、50 Hz 输入输出记录。通过扫频激励辨识各状态的 ARX 模型，阶次范围为 na = 4–5、nb = 3–4、nk = 1，拟合 VAF 为 98.0%–98.7%。策略输出经相同力接口积分与限幅，再按
      - generic [ref=e3576]:
        - math [ref=e3578]:
          - generic [ref=e3579]: δ
        - generic [ref=e3583]: δ
      - text: = −(10/22)
      - generic [ref=e3585]:
        - math [ref=e3587]:
          - generic [ref=e3588]: F
        - generic [ref=e3592]: F
      - text: 映射为副翼偏角，辨识模型的滚转角速度反馈至策略。
    - paragraph [ref=e3593]:
      - text: 采用 small 学生进行目标域更新，优化其全部 75,040 个参数。8 个配平状态提供适配样本，另外 4 个状态用于更新后的留出评价。优化执行 40 次 Adam 更新，学习率为 3×10
      - superscript [ref=e3594]: −5
      - text: ；损失统计响应开始 2 s 后的跟踪平方误差。评价使用确定性策略、15 deg/s 正阶跃及 8 s 时域。
