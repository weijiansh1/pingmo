    - heading "5.2 专用教师的控制能力" [level=3] [ref=e3965]
    - paragraph [ref=e3966]:
      - text: 主试验选取 50 个源域对象开展逐对象教师训练，已有 46 个教师达到统一性能门限。图 6 展示三个品质等级代表对象的阶跃与多正弦响应，同时给出角速度跟踪和操纵量变化，形成多教师蒸馏的控制经验来源。训练收敛曲线及对象参数与误差的关系见
      - link "附录 B.1" [ref=e3967] [cursor=pointer]:
