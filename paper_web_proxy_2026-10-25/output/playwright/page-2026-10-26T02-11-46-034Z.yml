    - paragraph [ref=e4004]: 图 8 比较同一源对象上教师与学生的响应。六档阶跃的上升过程接近，学生在 2 s 后的跟踪 RMSE 为教师的 2.3–3.3 倍；双脉冲与多正弦上的比值为 1.5–1.9。该时域对照与表 5 的对象级统计共同呈现蒸馏后的瞬态过程和跟踪精度。
    - figure "图 8 教师与统一学生在主试验对象 7 上的同指令时域对照。黑色点线为目标，蓝线为教师，橙线为学生；标题报告 2 s 后的跟踪 RMSE 及其比值。" [ref=e4005]:
      - img "图 8 教师与统一学生在主试验对象 7 上的同指令时域对照。黑色点线为目标，蓝线为教师，橙线为学生；标题报告 2 s 后的跟踪 RMSE 及其比值。" [ref=e4006]
    - heading "5.3.2 跨对象闭环控制性能评估" [level=3] [ref=e4008]
    - paragraph [ref=e4009]: 采用 12 对象配对组比较专用教师与统一学生，每个品质等级含 4 个对象，共三次训练重复。每个教师依次控制全部对象，学生控制相同对象；每个控制器在每个对象上测试 18 条指令，时域为 8 s。跨对象使用的教师读取当前被控对象的参数与状态，学生依靠常规观测和历史；所有权重固定。
    - paragraph [ref=e4010]: 在有限轨迹上，统一学生的跟踪 RMSE 中位数为 0.96 deg/s，自身教师为 0.75 deg/s，教师跨对象使用时为 3.28 deg/s。统一学生以一组共享权重，在多个源对象上保持了与专用教师相近的跟踪误差量级；相较直接跨对象使用专用教师，共享策略获得了更低的跟踪误差。
    - paragraph [ref=e4011]:
      - text: 图 9 在同一被控对象及相同指令、初始偏差和外力扰动下，对照自身教师、跨对象教师与统一学生的跟踪和恢复过程。样例按训练阶段的独立验证记录选取，完整规则、逐控制器结果和补充对象覆盖见
      - link "附录 B.2" [ref=e4012] [cursor=pointer]:
        - /url: "#results-cross-object-details"
      - text: 。
    - figure "图 9 验证达标教师与统一学生的闭环对照。三行受控对象为 1、6、9，迁移教师为 6、9、1；三列依次展示指令跟踪、初始偏差恢复和外力扰动抑制。黑色实线为外部指令，灰色点线为记录目标。" [ref=e4013]:
      - link [ref=e4014] [cursor=pointer]:
        - /url: paper/cross_object_responses.svg?v=labels-526d23b743ea
        - img "图 9 验证达标教师与统一学生的闭环对照。三行受控对象为 1、6、9，迁移教师为 6、9、1；三列依次展示指令跟踪、初始偏差恢复和外力扰动抑制。黑色实线为外部指令，灰色点线为记录目标。" [ref=e4015]
    - heading "5.3.3 对象覆盖与分布外控制性能" [level=3] [ref=e4017]
    - paragraph [ref=e4018]: 采用 300 个同分布对象和 500 个分布外对象评价统一学生的对象覆盖，前者从主试验 48 个评估对象之外抽取。学生权重保持固定，每个对象测试 14 条输入配置，各重复两次，共 22,400 条轨迹，记录跟踪误差、峰值误差与操纵变化。
    - paragraph [ref=e4019]:
      - text: 同分布对象上，±1 deg/s 和 ±31 deg/s 阶跃的跟踪 RMSE 中位数分别为 0.11、1.13 deg/s；分布外对象上相应为 0.21、2.93 deg/s。这组结果给出同一策略在不同对象分布及指令幅值下的跟踪误差水平。补充控制器对照见
      - link "附录 B.4" [ref=e4020] [cursor=pointer]:
        - /url: "#results-pid-comparison"
      - text: 。
    - heading "5.3.4 历史表征对照" [level=3] [ref=e4021]
    - paragraph [ref=e4022]:
      - text: 统一学生利用输入—响应历史获取对象动态线索。按第 3.3.1 节的输入设计与训练配置，保留基线时序编码的学生及 SAE 辅助输入方案在长延迟层均达到 90.0% 通过率，PCA-16、稠密 AE-16、Top-k SAE-16 替换方案分别为 51.6%、63.7%、71.9%。本实现据此采用与控制任务联合学习的时序编码，将历史映射为 16 维特征参与决策。完整闭环对照见
      - link "附录 A.3" [ref=e4023] [cursor=pointer]:
        - /url: "#s613"
      - text: ，信息读出与长时动态分析见
      - link "附录 A" [ref=e4024] [cursor=pointer]:
        - /url: "#appendix-history"
      - text: 。
    - heading "5.4 DHC-6 目标域适配" [level=3] [ref=e4025]
    - paragraph [ref=e4026]: 在 DHC-6 ARX 目标模型上，small 学生经 40 次参数更新，8 个适配状态的 RMSE 中位数由 2.913 降至 0.595 deg/s，4 个留出状态由 2.662 降至 2.148 deg/s，分别降低 79.6% 和 19.3%。所有状态均采用 15 deg/s 阶跃和 8 s 评价时域。
    - figure "图 10 代表性 DHC-6 仿真状态的微调前后闭环响应。适配状态微调后贴合参考；留出状态保持原策略的响应形态。" [ref=e4027]:
      - img "图 10 代表性 DHC-6 仿真状态的微调前后闭环响应。适配状态微调后贴合参考；留出状态保持原策略的响应形态。" [ref=e4028]
    - paragraph [ref=e4030]:
      - text: 适配状态与留出状态的改善体现了源域控制知识在目标模型上的更新和跨状态复用。逐状态统计、两档模型的完整数值及共同更新预算见
      - link "附录 B.3" [ref=e4031] [cursor=pointer]:
        - /url: "#results-transfer-details"
      - text: 。
    - heading "6讨论" [level=2] [ref=e4032]
    - paragraph [ref=e4033]: 飞行品质为飞控大模型提供了组织控制知识的坐标。操纵效能、模态阻尼、响应时间和时延将不同对象转化为结构统一的控制任务；逐对象教师学习相应反馈策略，多轮蒸馏再将这些策略汇聚为共享参数。滚转通道结果表明，该框架能够将对象族上的控制经验转化为统一学生的多对象控制能力。
    - paragraph [ref=e4034]: 知识汇聚的价值体现在精度、覆盖和实现规模的组合上。tiny 学生以 3,856 个参数实现多对象控制；历史表征对照支持保留与控制任务共同学习的时序编码。跟踪门限、操纵活动和恢复过程共同描述控制性能，长时响应进一步提供振荡衰减与残余误差的信息。
    - paragraph [ref=e4035]: 目标域适配将这条路线延伸到 DHC-6 仿真记录辨识的模型。small 学生在有限更新预算下同时改善适配状态与留出状态，展示了共享控制知识的小样本更新能力。由品质对象族到目标模型的验证，为后续加入执行机构特性和多轴耦合提供了方法基础。
    - heading "7结论" [level=2] [ref=e4036]
    - paragraph [ref=e4037]: 本文提出基于飞行品质的飞控大模型构建路线，并以滚转通道完成从对象组织、特权教师学习、多轮蒸馏到目标域适配的验证。飞行品质参数将对象差异组织为可学习任务，教师控制经验经 DAgger 汇聚为统一策略，实现了控制知识的离线积累与共享。
    - paragraph [ref=e4038]: 统一学生以 3,856 个参数保留多对象控制能力，在 44 个蒸馏源对象上的 RMSE 中位比为 1.28。在 500 个分布外对象的 ±1 deg/s 测试中，通过率达到 86.8%。历史表征对照支持使用任务驱动的时序编码，形成从观测历史到统一控制动作的部署形式。
    - paragraph [ref=e4039]: DHC-6 仿真适配进一步展示了共享策略的更新能力：small 学生经 40 次更新，将适配状态 RMSE 中位数降至 0.59 deg/s，留出状态降至 2.15 deg/s。上述证据共同支撑了基于飞行品质组织控制知识、通过教师—学生学习形成统一飞控策略的技术路线。
