    - paragraph [ref=e3957]: 主试验学生在 48 个对象上采用 30 条加权指令和每对象 64 条并行确定性轨迹评价。幅值扫描包含 300 个同分布对象、500 个分布外对象及 14 条输入配置，每个对象—指令组合重复两次。12 对象配对组包含三组训练重复；DHC-6 以配平状态为适配和留出单元，在固定阶跃及单一策略种子下评价。各组分别按其对象和测试单元统计。
    - heading "5 滚转通道验证" [level=2] [ref=e3958]
    - heading "5.1 品质对象族的动态覆盖" [level=3] [ref=e3959]
    - paragraph [ref=e3960]:
      - text: 5,000 个品质参数化对象覆盖操纵效能、模态和输入时延的差异，其中 4,500 个用于训练及同分布评估，500 个用于分布外评估。参数空间散点展示不同品质等级与数据划分的分布，参数边际分布见
