    - paragraph [ref=e4094]: 表 7 与图 18 给出闭环结果。raw_ft 与 tiny 基线基本一致（短 93.1%、中 95.3%、长 90.0%），说明当前 BC/DAgger 流程没有破坏基线。所有 16 维替换类都低于 raw：PCA-16 为 60.0/60.3/51.6%，稠密 AE-16 为 69.1/72.5/63.7%，Top-k SAE-16 为 85.6/79.7/71.9%。SAE-aux 保持 93.1/95.6/90.0%，与 raw 持平。
    - paragraph [ref=e4095]: 跨时延列给出更直接的检验：仅用短/中延迟训练后，raw 与 SAE-aux 仍保持 90.0% 和 90.0%，PCA 降到 47.5%，Top-k SAE 从 71.9% 降到 46.2%。Top-k SAE 在同分布替换类中最好，但其优势没有转化为跨时延迁移；相反，它对训练时见过的延迟范围更敏感。SAE-aux 与 raw 持平（90.0% 对 90.0%），定位为安全选项：保留原始历史、附加潜码不改变主策略行为。
    - paragraph [ref=e4096]: PCA 与稠密 AE 各重复一次，长延迟通过率分别落在 51.6–55.6% 与 52.5–63.8%；这说明替换类的具体排序对种子敏感，但“明显低于 raw”这一定性结论在两次运行中一致。raw 与 SAE-aux 的 90% 在重复运行中保持稳定。
    - heading [level=4] [ref=e4097]:
      - text: 6.1.4 τ
      - subscript [ref=e4098]: p
      - text: 与 GJB 等效时间延迟 τ
      - subscript [ref=e4099]: e
      - text: 的职责边界
    - paragraph [ref=e4100]:
      - text: GJB 2874-1997 A5.4.1.1.5（印刷 246–247，PDF 250–251）对滚转轴给出
      - strong [ref=e4101]:
        - text: 等效时间延迟 τ
        - subscript [ref=e4102]: e
      - text: 的建议上限：1 级 0.10 s、2 级 0.20 s、3 级 0.25 s（表 A21）。同页说明，该要求针对前置滤波器、SAS、舵机等
      - strong [ref=e4103]: 综合延迟作用
      - text: ；A4.9（印刷 68，PDF 72）进一步指出，经典传递函数通常要加入时间延迟项，以改善高频拟合，并与驾驶员评价相关。
    - paragraph [ref=e4104]:
      - text: 滚转轴低阶等效系统（LOES）是
      - strong [ref=e4105]: 4 阶
      - text: ，不是 2 阶或 3 阶。GJB A5.4.1.1.1（印刷 210–211，PDF 214–215）的滚转速率传递函数包含滚转、螺旋和荷兰滚三个模态；印刷 212 页明确说滚转速率响应通常由这三个模态组成。其分母为 (s−λ
      - subscript [ref=e4106]: s
      - text: )(s+1/T
      - subscript [ref=e4107]: R
      - text: )(s²+2ζ
      - subscript [ref=e4108]: d
      - text: ω
      - subscript [ref=e4109]: d
      - text: s+ω
      - subscript [ref=e4110]: d
      - text: ²)，共 4 阶；分子为 s(s²+2ζ
      - subscript [ref=e4111]: φ
      - text: ω
      - subscript [ref=e4112]: φ
      - text: s+ω
      - subscript [ref=e4113]: φ
      - text: ²)，共 3 阶；再乘 e
      - superscript [ref=e4114]:
        - text: −τ
        - subscript [ref=e4115]: e
        - text: s
      - text: 。τ
      - subscript [ref=e4116]: e
      - text: 是这个 4 阶拟合的延迟项，不是一只独立的硬件计时器。
    - paragraph [ref=e4117]:
      - text: 因此 τ
      - subscript [ref=e4118]: e
      - text: 不是对象参数，而是
      - strong [ref=e4119]: 闭环拟合量
      - text: 。它依赖控制器、采样保持、作动器、滤波器、增稳系统和拟合协议；同一对象换控制器，τ
      - subscript [ref=e4120]: e
      - text: 会变；训练前也无法知道。若把 τ
      - subscript [ref=e4121]: e
      - text: 作为 plant 采样参数，会形成循环依赖，并使训练/测试划分随策略变化。
    - paragraph [ref=e4122]:
      - text: 本文的 τ
      - subscript [ref=e4123]: p
      - text: 是对象输入前的纯运输 FIFO 延迟（e
      - superscript [ref=e4124]:
        - text: −τ
        - subscript [ref=e4125]: p
        - text: s
      - text: ），可在训练前采样，用于生成对象族、训练和延迟分层。它不是 GJB 的 τ
      - subscript [ref=e4126]: e
      - text: ；表 A21 的 0.10/0.20/0.25 s 不能用于给 τ
      - subscript [ref=e4127]: p
      - text: 打等级。要评价 τ
      - subscript [ref=e4128]: e
      - text: ，需要另建完整闭环 + 4 阶 LOES 拟合 + 残差检查；本文在 6.1.5 给出首版评价，但受单种子、单幅值和项目门限限制，仍不构成 A21 符合性结论。
    - table [ref=e4129]:
      - caption [ref=e4130]:
        - text: 表 9 τ
        - subscript [ref=e4131]: p
