    - paragraph [ref=e4228]:
      - text: 结果有三点。其一，
      - strong [ref=e4229]:
        - text: τ
        - subscript [ref=e4230]: e
        - text: 随 τ
        - subscript [ref=e4231]: p
        - text: 增大
      - text: ：原始历史在短、中、长延迟的可评中位 τ
      - subscript [ref=e4232]: e
      - text: 分别为 0.042、0.127、0.299 s；SAE-aux 为 0.032、0.125、0.309 s。长延迟对象的 τ
      - subscript [ref=e4233]: e
      - text: 中位约 0.30 s，已超过表 A21 的 3 级上限 0.25 s。
    - paragraph [ref=e4234]:
      - text: 其二，
      - strong [ref=e4235]: 可评比例本身是结果
      - text: ：120 架中，原始历史 73 架、SAE-aux 102 架通过 4 阶 LOES 拟合门；Top-k SAE-16 为 0 架。Top-k SAE 的闭环频响在低频段散乱并伴随持续振荡，VAF 中位仅 0.824、相位 RMSE 中位 35.1°，因此只能记
      - code [ref=e4236]: not_assessable
      - text: ，不能把 τ
      - subscript [ref=e4237]: e
      - text: 填成 0。
    - paragraph [ref=e4238]:
      - text: 其三，
      - strong [ref=e4239]: 可评集合内的等级分布并不乐观
      - text: ：原始历史 73 架可评对象中，1 级 43 架、2 级 15 架、3 级 4 架、超过 3 级 11 架；SAE-aux 102 架可评对象中分别为 51、14、7、30 架。SAE-aux 的可评比例更高，但在可评集合内 τ
      - subscript [ref=e4240]: e
      - text: 中位反而更高；这是选择效应——raw 的许多长延迟难例因残差不过门被排除，两个集合不能直接比较。
    - paragraph [ref=e4241]:
      - text: 局限：主表为种子 1、每分量 1 deg/s、180 s 记录；6.1.6 补了三档幅值与第二种子，但仍不是多源/多机型统计。拟合门限（VAF 0.95、相位 10°）是项目设定，不是 GJB 规定；参考模型被计入飞控系统。因此表 10 只说明当前策略在“可拟合对象”上的 τ
      - subscript [ref=e4242]: e
      - text: 量级，不构成 A21 符合性结论；Top-k SAE 的
      - code [ref=e4243]: not_assessable
      - text: 也不能解释为“延迟更小”。
    - heading [level=4] [ref=e4244]:
      - text: 6.1.6 τ
      - subscript [ref=e4245]: e
      - text: 评价的稳健性：激励幅值与策略种子
    - paragraph [ref=e4246]:
      - text: 为检查 τ
      - subscript [ref=e4247]: e
      - text: 是否只是某一激励幅值下的拟合产物，在同一 120 架 × 3 策略上重复了 0.5、1.0、2.0 deg/s（每分量）三档多正弦激励，拟合协议与门限保持不变。表 11 和图 20 给出结果。
