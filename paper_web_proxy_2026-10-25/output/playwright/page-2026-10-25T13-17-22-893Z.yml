    - paragraph [ref=e4331]:
      - text: 两个种子的结果基本一致。原始历史可评数 73 → 77，τ
      - subscript [ref=e4332]: e
      - text: 中位 0.073 → 0.078 s，共同可评集 73 架的中位 0.073 → 0.075 s，等级分布 43/15/4/11 → 43/15/5/14。SAE-aux 可评数 102 → 106，中位 0.102 → 0.106 s，共同 101 架中位 0.100 → 0.095 s，等级分布 51/14/7/30 → 52/15/7/32。
    - paragraph [ref=e4333]:
      - text: Top-k SAE 两个种子均为 0/120 可评，说明它的
      - code [ref=e4334]: not_assessable
      - text: 不是某一策略种子的偶然。由此可以认为：6.1.5 的 τ
      - subscript [ref=e4335]: e
      - text: 量级、延迟分层的单调趋势，以及 Top-k SAE 的拟合失败，在“两个种子 × 三档幅值”的范围内是稳健的；但这不是多源、多机型或 GJB 审定意义上的统计置信度。
