    - paragraph [ref=e4282]:
      - text: 幅值主要影响
      - strong [ref=e4283]: 可评比例
      - text: ，而不是 τ
      - subscript [ref=e4284]: e
      - text: 本身：原始历史可评数从 41 升到 73、再到 91，SAE-aux 从 78 升到 102、再到 111；这是因为大幅值提高了信噪比，使 4 阶 LOES 更容易过相位门。但在 40 架（raw）和 75 架（aux）
      - strong [ref=e4285]: 三种幅值都可评
      - text: 的共同对象上，τ
      - subscript [ref=e4286]: e
      - text: 中位基本稳定：raw 为 0.055–0.066 s，aux 为 0.105–0.116 s，跨度约 0.01 s。因此 6.1.5 的 τ
      - subscript [ref=e4287]: e
      - text: 排序不是单一幅值造成的假象。
    - paragraph [ref=e4288]: Top-k SAE-16 在三种幅值下均为 0/120：VAF 中位分别为 0.732、0.824、0.807，相位 RMSE 中位分别为 52.6°、35.1°、40.9°。这说明它的 not_assessable 不是幅值选错，而是闭环响应本身不能被 4 阶 LOES 表示（或长时小信号下持续振荡）。
    - paragraph [ref=e4289]:
      - text: 拟合门限本身也做了敏感性检查：相位门取 8°、10°、12° 时，原始历史可评数为 53/73/84，τ
      - subscript [ref=e4290]: e
      - text: 中位为 0.071/0.073/0.090 s；SAE-aux 为 81/102/110 和 0.100/0.102/0.098 s；Top-k SAE 始终为 0。可见可评比例依赖门限，但 raw/aux 的 τ
      - subscript [ref=e4291]: e
      - text: 量级和 Top-k SAE 的失败对门限不敏感。
    - paragraph [ref=e4292]:
      - text: 为检查策略训练随机性，raw、Top-k SAE 和 SAE-aux 各用第二种子重训（相同 BC/DAgger 预算），再做同一 τ
      - subscript [ref=e4293]: e
      - text: 评价。表 12 和图 21 给出结果。
