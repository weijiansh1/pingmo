    - heading "5结果" [level=2] [ref=f1e3589]
    - heading "5.1 第一步：采样对象的分布覆盖" [level=3] [ref=f1e3590]
    - paragraph [ref=f1e3591]: 参数库共含 5,000 个对象：4,500 个构成训练及同分布对象池，500 个作为分布外集合。图 4 展示八维参数中两两组合的采样位置，图 5 展示各参数边际分布和 49 个教师训练对象的位置。覆盖范围由实验设计给定；库中 49 个对象训练了教师。
    - figure "图 4 5,000 个飞行品质对象的参数空间采样散点。颜色区分品质等级，标记区分训练与分布外对象。" [ref=f1e3592]:
