    - paragraph [ref=f1e3963]:
      - text: 这一边界也解释了为什么 6.1.2 的探针目标是 τ
      - subscript [ref=f1e3964]: p
      - text: 而不是 τ
      - subscript [ref=f1e3965]: e
      - text: ：τ
      - subscript [ref=f1e3966]: p
      - text: 是每架飞机在训练前就确定的静态标签，适合做延迟分层和可解码性检验；τ
      - subscript [ref=f1e3967]: e
      - text: 随策略变化，不能作为固定的 plant 标签。若后续要回答“当前策略的 GJB 等效延迟是多少”，应在完整闭环上单独做 τ
      - subscript [ref=f1e3968]: e
      - text: 拟合，而不是把本节结果改写成 A21 等级。
    - heading [level=4] [ref=f1e3969]:
      - text: 6.1.5 GJB τ
      - subscript [ref=f1e3970]: e
      - text: 首版评价（120 架 × 3 策略）
    - paragraph [ref=f1e3971]:
      - text: 按 6.1.4 的边界，本文另建了一个 τ
      - subscript [ref=f1e3972]: e
      - text: 评价原型：在 120 架留出对象（短/中/长各 40）上，对原始历史、Top-k SAE-16 和 SAE-aux 三个策略，注入 0.1–10 rad/s 的 18 分量多正弦滚转指令，记录 180 s 闭环响应；在 50 Hz 采样上估计 H(jω) = P/P
      - subscript [ref=f1e3973]: c
      - text: ，再拟合 4 阶滚转 LOES（滚转 + 螺旋 + 荷兰滚）和 τ
      - subscript [ref=f1e3974]: e
      - text: 。二阶参考模型保留在回路内，视为飞控系统的一部分。
    - paragraph [ref=f1e3975]:
      - text: 拟合门限为项目设定，不是 GJB 规定：幅值 VAF ≥ 0.95 且相位 RMSE ≤ 10°；不过门记
      - code [ref=f1e3976]: not_assessable
      - text: ，不赋 A21 等级。表 10 和图 19 给出结果。
    - table [ref=f1e3977]:
      - caption [ref=f1e3978]:
        - text: 表 10 GJB τ
