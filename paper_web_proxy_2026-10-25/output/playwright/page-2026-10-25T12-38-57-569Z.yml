    - paragraph [ref=e631]:
      - text: 结果可归纳为三点。其一，
      - strong [ref=e632]: 延迟是可解码的
      - text: ：36 维互相关在 1.2 s 即达到 R² = 0.995、MAE = 2.9 ms；稠密 AE、原始历史和 PCA 也在约 0.50–0.61 之间。其二，
      - strong [ref=e633]: 稀疏有明显代价
      - text: ：16 维稠密 AE 为 0.608，而 L0≈7 的 L1-SAE 为 0.344，top-k4 仅 0.122；L0≈3.5 时进一步降到 0.075。其三，
      - strong [ref=e634]: 简单时移特征优于学习表征
      - text: ：延迟信息主要存在于请求力与响应之间的时移，而不是绝对幅值或低维流形；互相关的 MAE 比最好的 16 维学习表征低约一个数量级。
    - paragraph [ref=e635]: 由此得到的输入选型结论是：延迟信息在历史中可被线性读出，稠密 16 维编码保留该信息（PCA 与稠密 AE 的 R² 约 0.50–0.61）， 稀疏约束使其丢失（L0≈7 为 0.344，top-k4 为 0.122）。16 维本身不构成瓶颈，稀疏性才是；因此策略输入保留原始历史， 若需压缩则用稠密编码，不用稀疏潜码。
    - paragraph [ref=e636]: 本节在 510 架对象、16 维瓶颈、线性读出与 0–0.2 s 时延范围内评估。互相关探针用于判断历史中是否含有延迟信息， 它本身不是可部署控制器。
    - heading "6.1.3 闭环对照与跨时延迁移" [level=4] [ref=e637]
    - paragraph [ref=e638]:
      - text: 闭环对照在同一 510 架对象划分上进行。策略变体包括：原始历史（tiny 微调）、PCA-16、稠密 AE-16、Top-k SAE-16，以及把 SAE 潜码作为辅助输入接回 tiny 的 SAE-aux。为保证比较公平，除 raw 基线外，各变体在相同 BC 数据上预训练，并用同一 DAgger 预算（96 架源域对象、β = 0.5、8 轮）补充学生自身访问状态；评价仍按短、中、长延迟分层。跨时延列另训一组仅见短/中延迟（τ
      - subscript [ref=e639]: p
      - text: ≤ 0.15 s）的模型，在长延迟留出对象上评价。
