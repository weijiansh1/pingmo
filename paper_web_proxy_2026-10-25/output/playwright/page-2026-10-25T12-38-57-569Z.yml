    - heading "3方法：四步构建与迁移" [level=2] [ref=e174]
    - paragraph [ref=e175]: 图 1 概括本文的离线训练链路。四步各自的产物与证据一并画在图上：对象族的参数分布、49 个教师的通过情况、学生网络与接口，以及目标域适配前后的误差。前两步在飞行品质参数化对象上构造并训练教师，第三步将多对象教师压缩为共享学生，第四步以目标域仿真模型更新学生参数。四步使用不同对象集和监督信号，后续各节分别给出定义。
    - figure "图 1 四步方法与各步证据：品质分级采样（5,000 架）→ PPO 教师训练（49 架，46 架通过门限）→ DAgger 蒸馏（3,856 参数，不含特权输入）→ 小样本微调（12 个 DHC-6 状态，中位跟踪误差由 2.91 降至 0.59 deg/s）。" [ref=e176]:
