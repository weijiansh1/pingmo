    - heading "5.3.4 与固定增益 PID 的对照" [level=3] [ref=e469]
    - paragraph [ref=e470]:
      - text: 为判断上述边界是否是“学习控制器特有”，在同一批对象（300 同分布 + 500 分布外）和同一批指令上 运行一个经典基线：二阶自由度 PID，含参考前馈、抗积分饱和，输入为力请求（±22 N），再折算成同一 力速率接口。增益在对象 train_core-0421 上做网格搜索得到（k
      - subscript [ref=e471]: p
      - text: =128、k
      - subscript [ref=e472]: i
      - text: =60、 k
      - subscript [ref=e473]: d
      - text: =0.8、k
      - subscript [ref=e474]: ff
      - text: =6.0），此后**不再调整**，即无增益调度。
    - paragraph [ref=e475]: 按同一门限判定，学生在全部指令与全部对象上通过率更高：同分布 ±1 为 99.7% 对 80.0%，±31 为 60.3% 对 35.7%； 分布外差距更大，±1 为 86.8% 对 46.6%，±31 为 27.6% 对 16.2%。PID 的零样本失效集中在分布外对象： 中位 RMSE 随对象变化跨 8.8–18.5 deg/s，学生在同一批对象上为 0.21–2.93 deg/s。小幅值段 PID 的中位误差更低 （0.06 对 0.11），但其峰值与力变化率越界，因此门限通过率反而更低——两者在“精度”与“合格”上不是同一口径。
