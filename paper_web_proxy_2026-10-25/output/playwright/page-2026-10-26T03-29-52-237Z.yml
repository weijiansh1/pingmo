          - cell "tiny 学生固定权重，11,200 个对象—指令组合" [ref=e4580]
    - paragraph [ref=e4581]: 主试验学生在 48 个对象上采用 30 条加权指令和每对象 64 条并行确定性轨迹评价。幅值扫描包含 300 个同分布对象、500 个分布外对象及 14 条输入配置，每个对象—指令组合重复两次。12 对象配对组包含三组训练重复；DHC-6 以配平状态为适配和留出单元，在固定阶跃及单一策略种子下评价。各组分别按其对象和测试单元统计。
    - heading "5 滚转通道验证" [level=2] [ref=e4582]
    - heading "5.1 品质对象族的动态覆盖" [level=3] [ref=e4583]
    - paragraph [ref=e4584]: 5,000 个对象在参数空间中的分布如图 5 所示，其中三个品质等级各 1,500 个，分布外对象为 500 个。各参数的边际分布见附录 B.1。
    - figure "图 5 5,000 个对象的参数空间投影。颜色区分三个品质等级与分布外对象，虚线标出所选分级边界。" [ref=e4585]:
      - img "图 5 5,000 个对象的参数空间投影。颜色区分三个品质等级与分布外对象，虚线标出所选分级边界。" [ref=e4586]
    - paragraph [ref=e4588]: 时间常数—频率平面覆盖了快、慢滚转及低频模态，阻尼—频率平面则显示不同的振荡衰减条件。各等级在二维投影中仍有重叠，因为分级还涉及螺旋模态和灵敏度。部分分布外对象也落在图示坐标的常规范围内，它们的越界发生在其他参数或参数组合上。
    - heading "5.2 专用教师的控制能力" [level=3] [ref=e4589]
    - paragraph [ref=e4590]: 主试验选取 50 个源域对象开展逐对象教师训练，已有 46 个教师达到统一性能门限。图 6 给出三个品质等级代表对象的阶跃与多正弦响应，训练诊断和对象参数与误差的关系见附录 B.1。
    - figure "图 6 教师训练完成后的源域闭环效果：不同品质等级的阶跃与多正弦响应。" [ref=e4591]:
      - img "图 6 教师训练完成后的源域闭环效果：不同品质等级的阶跃与多正弦响应。" [ref=e4592]
    - paragraph [ref=e4594]: 三个代表对象的阶跃跟踪 RMSE 为 0.39–0.76 deg/s，多正弦下为 0.60–1.02 deg/s。跟踪误差接近时，操纵变化仍有明显差别：二级阶跃样例的请求力持续调整，完整 30 s 的总变差达到 506.8 N。图内的 TV 是总变差，项目指标则使用除以时长后的变化率；两者分别描述整段操纵累积和单位时间内的操纵活动。
    - heading "5.3 统一策略的知识汇聚与跨对象控制" [level=3] [ref=e4595]
    - paragraph [ref=e4596]: 学生先通过行为克隆学习教师动作，再进行五轮 DAgger 数据聚合。图 7 将行为克隆记为第 0 轮，随后记录第 1–5 轮聚合后的闭环结果。
    - figure "图 7 DAgger 轮次与师生闭环跟踪误差比。第 0 轮为行为克隆，随后在学生访问状态上追加教师标签。" [ref=e4597]:
      - img "图 7 DAgger 轮次与师生闭环跟踪误差比。第 0 轮为行为克隆，随后在学生访问状态上追加教师标签。" [ref=e4598]
    - paragraph [ref=e4600]: 追加学生访问状态上的教师标签后，误差比在前几轮下降较快，后期曲线趋于平缓。tiny 与 small 的源对象误差比分别达到 1.28、1.34；在 44 个源对象中分别有 37、38 个达标。留出对象的误差比为 1.68、1.41，两者均通过 3/4。参数规模、控制覆盖与相对精度的完整统计见表 6。
