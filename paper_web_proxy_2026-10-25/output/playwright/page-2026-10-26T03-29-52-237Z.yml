    - paragraph [ref=e4153]: 多轮聚合在学生访问的状态上持续追加教师标签，扩展训练样本的状态覆盖。训练中的动作均方误差约束师生动作差异；蒸馏后的控制能力通过冻结权重的闭环测试评价，指标见第 2.3 节。
    - figure "图 4 tiny 学生网络：32×5 历史经时序编码得到 16 维特征，与 9 维当前量和 7 维动作历史拼接为 32 维输入，经一个 32 宽残差块输出动作，共 3,856 个参数。" [ref=e4154]:
      - img "图 4 tiny 学生网络：32×5 历史经时序编码得到 16 维特征，与 9 维当前量和 7 维动作历史拼接为 32 维输入，经一个 32 宽残差块输出动作，共 3,856 个参数。" [ref=e4155]
    - paragraph [ref=e4157]: 学生将 160 维历史编码为 16 维特征，再与当前量和动作历史合并后计算控制动作。部署输入中没有独立的对象参数向量或模型内部状态，跨对象响应的差异需要通过反馈历史体现。3,856 个参数对应的是一套共享策略，各对象使用同一组权重。
    - heading "3.3.1 历史表征与稀疏编码对照" [level=4] [ref=e4158]
    - paragraph [ref=e4159]: 多教师蒸馏同时包含两种变化：将多个对象的控制经验合并到一套权重，并撤去教师使用的对象参数和内部状态。部署学生因而需要利用可观测的输入—响应历史区分对象动态。基线学生将 32×5 历史送入随控制任务联合训练的时序编码器，得到 16 维历史特征。历史中的对象信息能否被有效利用，是统一控制器输入设计需要检验的问题。
    - paragraph [ref=e4160]: 为检验显式表征学习能否改善对象动态信息的提取，设置 PCA、稠密自编码器和稀疏自编码器（SAE）前端对照。SAE 检验少数活跃特征能否集中保留对象动态线索，稠密编码用于比较稀疏约束的影响。SAE 采用 160→64→16 编码器和对称解码器，以 L1 或 top-k 约束限制潜码中的活跃分量。替换分支用冻结前端输出的 16 维特征替代基线时序特征；辅助分支在保留基线特征时再附加 SAE 潜码。各替换前端的历史特征维度均为 16，用于比较不同表征学习方式。
    - paragraph [ref=e4161]:
      - text: 评价分为信息读出和闭环控制两步：以对象输入运输时延
      - generic [ref=e4163]:
        - math [ref=e4165]:
          - generic [ref=e4168]:
            - generic [ref=e4169]: τ
            - generic [ref=e4170]: p
        - generic [ref=e4173]:
          - text: τ
          - generic [ref=e4174]: p
      - text: 为标签，检验因果历史中能否读出对象动态线索；再将相同表征接入策略，比较跟踪与恢复过程。探针和控制结果共同用于判断输入设计。该消融在既有 tiny 学生上进行，动作标签由该学生产生；原始历史与辅助输入分支继承其权重，替换分支训练新的策略头。完整网络和训练设置见
      - link "附录 A.1" [ref=e4183] [cursor=pointer]:
        - /url: "#s611"
      - text: 。
    - heading "3.4 目标域小样本适配" [level=3] [ref=e4184]
    - paragraph [ref=e4185]:
