    - heading "5.3.3 对象覆盖与分布外控制性能" [level=3] [ref=e4687]
    - paragraph [ref=e4688]: 采用 300 个同分布对象和 500 个分布外对象评价统一学生的对象覆盖，前者从主试验 48 个评估对象之外抽取。学生权重保持固定，每个对象测试 14 条输入配置，各重复两次，共 22,400 条轨迹，记录跟踪误差、峰值误差与操纵变化。
    - paragraph [ref=e4689]:
      - text: 同分布对象上，±1 deg/s 和 ±31 deg/s 阶跃的跟踪 RMSE 中位数分别为 0.11、1.13 deg/s；分布外对象上相应为 0.21、2.93 deg/s。这组结果给出同一策略在不同对象分布及指令幅值下的跟踪误差水平。补充控制器对照见
      - link "附录 B.3" [ref=e4690] [cursor=pointer]:
        - /url: "#results-pid-comparison"
      - text: 。
    - paragraph [ref=e4691]: 按对象级汇总指标评价时，主试验 tiny 学生在 120 个新增同分布对象上通过 94/120（78.3%），三个等级分别通过 34/40、30/40、30/40，RMSE 中位数为 0.64 deg/s，90 百分位为 2.24 deg/s。这些对象从 4,500 个同分布对象池按每级 40 个抽取，与主试验 48 个评估对象不重叠。
    - paragraph [ref=e4692]:
      - text: 在新增对象中，RMSE 与滚转操纵效能的相关系数为 −0.47；滚转时间常数
