    - heading "3 基于飞行品质的飞控大模型构建方法" [level=2] [ref=e1865]
    - paragraph [ref=e1866]: 本文以面向品质参数化对象族学习的共享飞控策略为模型主体，统一学生承担策略部署，特权教师库提供逐对象控制经验。图 2 给出对象族、教师、统一学生与目标域模型之间的构建关系。
    - figure "图 2 飞控大模型的构建与验证流程：品质对象族、特权 PPO 教师、多轮蒸馏与目标域适配。tiny 与 small 学生分别含 3,856 和 75,040 个参数；40 次目标域更新及 2.91→0.59 deg/s 的结果对应 small。" [ref=e1867]:
      - link "查看完整主图" [ref=e1868] [cursor=pointer]:
        - /url: paper/pipeline_framework.svg?v=teacher50-20261025
        - img "图 2 飞控大模型的构建与验证流程：品质对象族、特权 PPO 教师、多轮蒸馏与目标域适配。tiny 与 small 学生分别含 3,856 和 75,040 个参数；40 次目标域更新及 2.91→0.59 deg/s 的结果对应 small。" [ref=e1869]
    - paragraph [ref=e1871]: 逐对象教师将各自的控制任务转化为动作标签，蒸馏再把这些标签对应的反馈关系合并到共享权重。统一学生在源域对象上以固定权重运行；进入 DHC-6 环节后才利用适配状态更新参数。前一阶段检验跨对象控制，后一阶段考察已有策略在目标模型上的更新效果。
    - heading "3.1 品质参数化对象族" [level=3] [ref=e1872]
    - paragraph [ref=e1873]: 对象库按 IV 类飞机、A 类飞行阶段的滚转、螺旋、荷兰滚基准和灵敏度相关条件组织候选 [13]。采用九维扰动 Sobol 序列，先确定候选的品质区域，按目标分量设置品质梯度，其余分级分量取基础区域；随后生成模态、时延及灵敏度参数。对每个候选重新计算滚转、螺旋、荷兰滚和灵敏度分量的等级，按其中最差等级分层选入。最终得到 5,000 个对象，L1、L2、L3 各 1,500 个，另有 500 个分布外对象。
