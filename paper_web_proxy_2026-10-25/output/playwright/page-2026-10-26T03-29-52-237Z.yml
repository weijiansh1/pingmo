    - paragraph [ref=e2616]: 操纵效能的标定以 1 N 阶跃作用下的响应为基础：对角速度积分，取 1 s 时刻滚转角的绝对值与输入力幅值之比作为灵敏度。灵敏度目标按对数尺度从 0.85–3.38 deg/N 选取，二级候选扩展至 5.62 deg/N，分布外候选扩展至 8.43 deg/N。每次针对选定的分级分量扩展取值，再重新检查完整参数组合。
    - paragraph [ref=e2617]: 分布外划分同时考虑分级边界和参数包络，包括过大的滚转时间常数、不稳定螺旋根、低于 0.4 rad/s 的模态频率、高于 5.62 deg/N 的灵敏度，以及超出效能、零点频率比或时延包络的组合。5,000 个对象按对象编号划为 3,000 个训练候选、450 个验证对象、1,050 个同分布测试对象和 500 个分布外测试对象；教师训练、蒸馏及后续抽样使用这些对象池中的相应子集。
