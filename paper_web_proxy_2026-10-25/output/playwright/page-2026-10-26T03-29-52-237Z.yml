    - paragraph [ref=e4910]: 1.2 s 前缀上，请求力—响应互相关的时延读出 R² 为 0.995，MAE 为 2.9 ms，输入与响应的时移包含较清晰的时延线索。16 维稠密 AE 的 R² 为 0.608，Top-k SAE 为 0.122。延长前缀后，Top-k SAE 与稠密 AE 的 R² 分别为 0.506、0.656。各表征的读出结果与后续闭环对照共同用于选择学生的历史编码方式。
    - paragraph [ref=e4911]: 这一差异随观测时间变化：例如 Top-k SAE 的 R² 从 1.2 s 的 0.122 升至 2.0 s 的 0.506。因而输入设计既取决于压缩方式，也取决于信息何时可用。对学生控制器而言，接下来的关键是这些表征在持续反馈中的效果，而非单独追求探针分数。
    - paragraph [ref=e4912]: 本组读出结果覆盖 510 个对象、0–0.2 s 时延范围，采用 16 维编码与线性探针。它支持使用历史获取对象动态信息，并为下一组闭环实验提供表征对照。
    - heading "A.3 历史表征的完整闭环对照" [level=3] [ref=e4913]
    - paragraph [ref=e4914]: 在同一 510 个对象划分上，将表征用于控制：PCA-16、稠密 AE-16 和 Top-k SAE-16 替换原始历史，SAE-aux 则保留原始历史并附加 SAE 潜码。动作标签由既有 tiny 学生产生，检验的是对已蒸馏控制能力的保留。原始历史微调分支与 SAE-aux 继承 tiny 权重；替换分支训练新的策略头。各分支先用 BC 数据训练，替换分支和 SAE-aux 再通过 DAgger 追加自身访问状态：在 96 个源域对象上以 β = 0.5 采样，合并数据后再训练 8 个 epoch。
    - figure "图 14 历史表征的闭环对照。左：按输入时延分层的通过率。右：全延迟样本与短/中延迟样本再训练后的长延迟表现。留出集包含 120 个对象、960 条对象—指令轨迹。" [ref=e4915]:
