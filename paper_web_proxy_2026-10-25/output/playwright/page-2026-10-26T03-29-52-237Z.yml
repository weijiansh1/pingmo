    - heading "B.1 对象分布与教师学习诊断" [level=3] [ref=e5310]
    - paragraph [ref=e5311]: 图中给出八项对象参数的边际分布，配合正文的二维散点描述取值范围及其相互约束。
    - figure "图 19 5,000 个对象的参数边际分布。颜色表示选入等级，竖线标出相应分级或研究包络边界。" [ref=e5312]:
      - img "图 19 5,000 个对象的参数边际分布。颜色表示选入等级，竖线标出相应分级或研究包络边界。" [ref=e5313]
    - paragraph [ref=e5315]: 同分布对象的时延位于 0.001–0.20 s，零点频率比位于 0.65–1.35；分布外部分延伸到这些区间之外。零点阻尼比例系数的跨度较大，是由零点阻尼除以模态阻尼得到的，低阻尼候选会产生较大的比例值。操纵效能的分布则受 1 s 灵敏度标定与效能包络共同约束。
    - figure "图 20 教师跟踪误差与滚转操纵效能的关系（双对数）。颜色表示品质等级，红叉表示未通过对象；虚线为通过样本的拟合，相关系数 r = −0.74。" [ref=e5316]:
      - img "图 20 教师跟踪误差与滚转操纵效能的关系（双对数）。颜色表示品质等级，红叉表示未通过对象；虚线为通过样本的拟合，相关系数 r = −0.74。" [ref=e5317]
    - paragraph [ref=e5319]: 达标教师中，操纵效能与跟踪 RMSE 的双对数相关系数为 −0.74，较低效能一侧的误差总体更大，未通过样例也集中在该区域。在当前力接口和训练设置下，低效能对象是误差较突出的部分；相近效能处仍有分散，其他模态和时延条件也随对象变化。
    - figure "图 21 21 个达标教师的固定指令集验证结果：跟踪误差、操纵总变差及所选权重对应的训练步数。" [ref=e5320]:
      - img "图 21 21 个达标教师的固定指令集验证结果：跟踪误差、操纵总变差及所选权重对应的训练步数。" [ref=e5321]
    - paragraph [ref=e5323]: 固定验证误差随训练总体下降，请求力总变差则呈现不同的变化过程。21 个存档教师中，11 个选择最后一个检查点，其余 10 个选择更早的权重。最终选用的控制器由验证表现确定，训练末步与所选权重并不总是相同。
