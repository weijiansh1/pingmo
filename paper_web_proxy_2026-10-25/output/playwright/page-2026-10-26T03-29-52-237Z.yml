    - paragraph [ref=e1025]: 学生每 20 ms 根据当前观测和历史输出动作，仿真器以 1 ms 步长推进对象状态。单条轨迹中，对象参数和策略权重固定，动作、施加力与角速度随反馈更新。按时间记录这些量就得到后文的响应曲线，其中的过冲和振荡取决于对象动态、力接口与控制策略的共同作用。
