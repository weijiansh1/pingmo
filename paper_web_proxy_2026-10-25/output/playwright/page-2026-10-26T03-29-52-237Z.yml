    - paragraph [ref=e5200]: 更明显的差异出现在 Top-k SAE-16：原始历史有 73/120 个通过拟合，SAE-aux 有 102/120 个，Top-k SAE 为 0/120。其 VAF 中位为 0.824、相位 RMSE 中位为 35.1°。结合图 18 的 180 s 响应和功率谱，可见持续低频振荡；这一变化超出了单一延迟数值所能描述的范围。
