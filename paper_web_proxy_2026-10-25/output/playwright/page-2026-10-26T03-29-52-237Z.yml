    - heading "4实验设置" [level=2] [ref=e4538]
    - paragraph [ref=e4539]: 实验围绕滚转通道的构建路线展开：主试验检验教师学习与学生蒸馏，配对实验检验专用教师迁移与统一学生的多对象控制，表征对照分析历史输入设计，DHC-6 仿真检验目标域适配。各组的对象集、控制器与评价协议见表 5。
    - heading "4.1 对象划分与评价协议" [level=3] [ref=e4540]
    - table [ref=e4542]:
      - caption [ref=e4543]: 表 5 数据划分与评估协议
