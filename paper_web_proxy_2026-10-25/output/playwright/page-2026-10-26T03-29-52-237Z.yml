    - heading "5.3.1 代表性闭环响应" [level=3] [ref=e4627]
    - paragraph [ref=e4628]: 图 8 比较主试验对象 7 上教师与学生在相同指令下的响应。误差标注采用 2 s 后的评价段。
    - figure "图 8 教师与统一学生在主试验对象 7 上的同指令时域对照。黑色点线为目标，蓝线为教师，橙线为学生；标题报告 2 s 后的跟踪 RMSE 及其比值。" [ref=e4629]:
      - img "图 8 教师与统一学生在主试验对象 7 上的同指令时域对照。黑色点线为目标，蓝线为教师，橙线为学生；标题报告 2 s 后的跟踪 RMSE 及其比值。" [ref=e4630]
    - paragraph [ref=e4632]: 正、负阶跃中，师生的主要上升过程接近，学生在 2 s 后的跟踪 RMSE 为教师的 2.3–3.3 倍。双脉冲与多正弦的比值为 1.5–1.9。逐指令响应给出瞬态与稳态行为，对象级中位统计则汇总多对象上的相对跟踪精度。
    - heading "5.3.2 跨对象闭环控制性能评估" [level=3] [ref=e4633]
    - paragraph [ref=e4634]: 采用 12 对象配对组比较专用教师与统一学生，每个品质等级含 4 个对象，共三次训练重复；12 个对象均参与相应学生的蒸馏。每个教师依次控制全部对象，学生控制相同对象；每个控制器在每个对象上测试 18 条指令，时域为 8 s。跨对象使用的教师读取当前被控对象的参数与状态，学生依靠常规观测和历史；所有权重固定。
    - paragraph [ref=e4635]: 在有限轨迹上，统一学生的跟踪 RMSE 中位数为 0.96 deg/s，自身教师为 0.75 deg/s，教师跨对象使用时为 3.28 deg/s。统一学生以一组共享权重，在多个源对象上保持了与专用教师相近的跟踪误差量级；相较直接跨对象使用专用教师，共享策略获得了更低的跟踪误差。
    - paragraph [ref=e4636]: 图 9 在同一被控对象及相同指令、初始偏差和外力扰动下，对照自身教师、跨对象教师与统一学生的跟踪和恢复过程。指令跟踪采用 8 s 时域，初始偏差与扰动恢复采用 30 s 时域。样例按训练阶段的独立验证记录选取。
    - figure "图 9 验证达标教师与统一学生的闭环对照。三行受控对象为 1、6、9，迁移教师为 6、9、1；三列依次展示指令跟踪、初始偏差恢复和外力扰动抑制。黑色实线为外部指令，灰色点线为记录目标。" [ref=e4637]:
      - link [ref=e4638] [cursor=pointer]:
        - /url: paper/cross_object_responses.svg?v=labels-526d23b743ea
        - img "图 9 验证达标教师与统一学生的闭环对照。三行受控对象为 1、6、9，迁移教师为 6、9、1；三列依次展示指令跟踪、初始偏差恢复和外力扰动抑制。黑色实线为外部指令，灰色点线为记录目标。" [ref=e4639]
    - paragraph [ref=e4641]: 对象 6、9 上，跨对象教师的阶跃响应出现较大过冲和摆动，统一学生与自身教师的响应更接近。初始偏差和外力扰动测试中，学生的后段残差也较小。对象 9 在 30 s 内仍可见残余偏差，恢复阶段的残余响应需与整段跟踪误差同时评价。
    - figure "图 10 专用教师跨对象控制与统一学生的对象覆盖。对角线为自身教师，非对角线为跨对象教师，末行为学生；每格汇总三次训练重复。右侧点为各次重复，横线为平均值。" [ref=e4642]:
      - link [ref=e4643] [cursor=pointer]:
