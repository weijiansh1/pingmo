      - text: "> 6 s 的 4 个对象中有 1 个通过。对象参数与性能的对应关系为下一阶段扩大训练覆盖提供了具体方向。"
    - heading "5.3.4 历史表征对照" [level=3] [ref=e4714]
    - paragraph [ref=e4715]:
      - text: 统一学生利用输入—响应历史获取对象动态线索。按第 3.3.1 节的输入设计与训练配置，保留基线时序编码的学生及 SAE 辅助输入方案在长延迟层均达到 90.0% 通过率，PCA-16、稠密 AE-16、Top-k SAE-16 替换方案分别为 51.6%、63.7%、71.9%。本实现据此采用与控制任务联合学习的时序编码，将历史映射为 16 维特征参与决策。完整闭环对照见
      - link "附录 A.3" [ref=e4716] [cursor=pointer]:
        - /url: "#s613"
      - text: ，信息读出与长时动态分析见
      - link "附录 A" [ref=e4717] [cursor=pointer]:
        - /url: "#appendix-history"
      - text: 。
    - heading "5.4 DHC-6 目标域适配" [level=3] [ref=e4718]
    - paragraph [ref=e4719]: 在 DHC-6 ARX 目标模型上，small 学生经 40 次参数更新，8 个适配状态的 RMSE 中位数由 2.913 降至 0.595 deg/s，4 个留出状态由 2.662 降至 2.148 deg/s，分别降低 79.6% 和 19.3%。所有状态均采用 15 deg/s 阶跃和 8 s 评价时域。
    - figure "图 11 代表性 DHC-6 仿真状态的微调前后闭环响应。适配状态微调后贴合参考；留出状态保持原策略的响应形态。" [ref=e4720]:
      - img "图 11 代表性 DHC-6 仿真状态的微调前后闭环响应。适配状态微调后贴合参考；留出状态保持原策略的响应形态。" [ref=e4721]
    - paragraph [ref=e4723]: 状态 5、8 在微调前有明显摆动，微调后振荡减弱，响应更接近目标；状态 2 的上升段也有所改善。留出的状态 9 在微调前后都低于最终目标速率。各配平状态上的更新效果通过瞬态形态和稳态误差共同描述。逐状态误差及两档模型的对照见附录 B.2。
    - heading "6讨论" [level=2] [ref=e4724]
    - paragraph [ref=e4725]: 多教师蒸馏将逐对象控制经验汇入共享策略。12 对象配对组中，统一学生的跟踪 RMSE 中位数为 0.96 deg/s，自身教师为 0.75 deg/s，跨对象教师为 3.28 deg/s。这组对照显示，知识汇聚使一套权重能够复用多个对象的反馈经验；专用教师读取新对象参数后的直接复用具有不同的控制表现。
    - paragraph [ref=e4726]: 学生的规模与精度呈现不同变化：small 的留出对象误差比较低，源对象上则略高于 tiny。历史表征对照也显示，较高的参数读出分数不必然对应更好的控制结果。网络规模和输入编码应结合实际闭环误差、操纵变化与恢复动态选择。
    - paragraph [ref=e4727]: DHC-6 更新主要改善了适配状态的跟踪与振荡，留出状态的整体改善幅度较小，且不同状态之间存在差异。后续扩展需围绕目标动态的覆盖，以及执行机构特性和多轴耦合条件下的闭环表现展开。
    - heading "7结论" [level=2] [ref=e4728]
    - paragraph [ref=e4729]: 本文提出基于飞行品质的飞控大模型构建路线，并以滚转通道完成从对象组织、特权教师学习、多轮蒸馏到目标域适配的验证。飞行品质参数将对象差异组织为可学习任务，教师控制经验经 DAgger 汇聚为统一策略，实现了控制知识的离线积累与共享。
    - paragraph [ref=e4730]: 统一学生以 3,856 个参数保留多对象控制能力，在 44 个蒸馏源对象上的 RMSE 中位比为 1.28。在 500 个分布外对象的 ±1 deg/s 测试中，通过率达到 86.8%。历史表征对照支持使用任务驱动的时序编码，形成从观测历史到统一控制动作的部署形式。
    - paragraph [ref=e4731]: DHC-6 仿真适配进一步展示了共享策略的更新能力：small 学生经 40 次更新，将适配状态 RMSE 中位数降至 0.59 deg/s，留出状态降至 2.15 deg/s。上述证据共同支撑了基于飞行品质组织控制知识、通过教师—学生学习形成统一飞控策略的技术路线。
