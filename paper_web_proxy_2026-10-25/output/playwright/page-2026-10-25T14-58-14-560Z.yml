      - text: ≤ 0.15 s）再训练，再到长延迟留出对象上评估：raw 与 SAE-aux 均为 90.0%，PCA 为 47.5%，Top-k SAE 从全延迟训练的 71.9% 降至 46.2%。这一对照反映限制再训练样本后的变化；raw 与 SAE-aux 保留了既有 tiny 权重中的知识。
    - paragraph [ref=f1e4387]: PCA 与稠密 AE 各重复一次，长延迟通过率分别落在 51.6–55.6% 与 52.5–63.8%，两次运行均低于 raw；raw 与 SAE-aux 的 90% 保持稳定。下一步转向长时闭环响应，检验短时通过率之外的动态差异。
