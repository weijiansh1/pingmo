    - paragraph [ref=f1e4363]: 表 9 和图 18 显示，保留原始历史的 raw_ft 在短、中、长延迟层通过率为 93.1%、95.3%、90.0%，SAE-aux 为 93.1%、95.6%、90.0%。替换历史后，PCA-16 为 60.0%、60.3%、51.6%，稠密 AE-16 为 69.1%、72.5%、63.7%，Top-k SAE-16 为 85.6%、79.7%、71.9%。附加稀疏潜码维持了基线表现，直接替换历史的三种方案均出现下降。
    - paragraph [ref=f1e4364]: 探针分数与控制性能的排序也不同：Top-k SAE 的早期时延读出弱于稠密 AE，但在替换类中闭环通过率更高。由此可见，线性时延可读出性并不足以决定控制效果；策略还要利用瞬态、幅值和动作历史等信息。当前结果支持主线学生继续保留原始历史，SAE-aux 尚未显示通过率收益。
    - paragraph [ref=f1e4365]:
      - text: 进一步仅用短、中延迟样本（
      - generic [ref=f1e4367]:
