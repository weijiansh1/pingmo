    - heading "6讨论" [level=2] [ref=f1e4125]
    - paragraph [ref=f1e4126]: 源域结果显示，50 个逐对象教师中多数达到项目门限；然而统一学生的 RMSE 中位数仍高于对应教师，且 4 个留出对象中仅 3 个通过。120 对象扩展抽样的通过率为 78.3%，幅值扫描则显示，±31 deg/s 阶跃通过率从同分布样本的 60.3% 降至 OOD 样本的 27.6%。在固定增益 PID 的对照中，学生策略在分布外对象上的退化幅度显著更小，但在同分布小幅值段的精度不及经过前馈整定的 PID。这些结果共同表明，蒸馏能够将策略压缩至数千参数并保留大部分常规响应能力，但学生策略对对象参数和指令幅值仍敏感。
    - paragraph [ref=f1e4127]: DHC-6 微调降低了 8 个适配状态和 4 个留出状态的 RMSE，但适配组改善大于留出组。两种容量的对比还说明，源域蒸馏对容量不敏感（1.28× 与 1.34×），但同一配方迁移到真实对象后，3,856 参数学生的适配后误差是 75,040 参数学生的 2.7 倍，且部分状态因更新顺序出现回退。这说明少量目标域数据可以在当前模型与测试条件下更新策略，。目标域对象由 DHC-6 仿真记录辨识得到的 ARX 模型表示；当前测试也未覆盖横航向耦合、状态估计误差和完整控制系统约束。
    - paragraph [ref=f1e4128]: 本文的飞行品质作用体现在源域对象参数化、等级覆盖和训练后门限评价。归档 PPO 奖励仍由跟踪误差、作用力能量和动作幅值构成，未逐项引入 GJB 条款指标。因此，当前证据支持的是“在飞行品质参数化对象上训练滚转控制器”，而不是“用 GJB 品质指标直接训练控制器”。若要验证后一目标，需将可计算的品质指标加入奖励或约束，并重新训练教师、蒸馏学生和实施目标域迁移；该扩展尚未完成。
    - heading "6.1 历史信息如何支持统一控制" [level=3] [ref=f1e4129]
    - paragraph [ref=f1e4130]:
      - text: 统一学生在部署时不接收教师使用的对象参数，而是依靠当前观测和历史响应控制不同对象。第 5 节已检验其闭环能力；本节进一步考察这一输入设计：历史中包含哪些对象动态线索，显式提取这些线索能否改善统一控制？选择输入运输时延
      - generic [ref=f1e4132]:
        - math [ref=f1e4134]:
          - generic [ref=f1e4137]:
            - generic [ref=f1e4138]: τ
            - generic [ref=f1e4139]: p
        - generic [ref=f1e4142]:
          - text: τ
          - generic [ref=f1e4143]: p
      - text: 作为分析变量，是因为它直接改变控制作用与对象响应的时间关系，对反馈控制和振荡抑制都有影响。
    - paragraph [ref=f1e4152]: 为此，在已蒸馏的 tiny 学生基础上比较原始历史、稠密编码和稀疏自编码器（SAE）。分析依次回答三个问题：时延信息能否从历史中读出，压缩表征能否维持闭环性能，以及表征改变后为何出现长时响应差异。SAE 在这里用于检验学生的历史输入设计。
    - heading "6.1.1 表征对照设计" [level=4] [ref=f1e4153]
    - paragraph [ref=f1e4154]:
      - text: 从 IV-A 对象库的 train_core、validation、id_test 三个互不重叠的划分中，按
