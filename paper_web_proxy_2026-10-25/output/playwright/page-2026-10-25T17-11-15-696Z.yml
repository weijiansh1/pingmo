    - heading "7结论" [level=2] [ref=e4243]
    - paragraph [ref=e4244]: 本文给出了一条可复用的链路：品质分级采样得到对象族，逐对象教师提供监督，单学生蒸馏把 50 个教师压到 3,856 参数， 目标域微调把通用律接到具体机型上。三个记忆点：其一，小型学生保留主要控制能力——学生与教师的中位误差比为 1.28 倍，容量放大 20 倍后仍为 1.34 倍； 其二，边界清晰——±1 deg/s 通过 99.7%、±31 deg/s 通过 60.3%，大幅值与分布外参数是主要失分区； 其三，迁移有效——40 步微调把适配状态中位误差降至 0.59 deg/s（−79.6%），留出状态降至 2.15 deg/s。
    - paragraph [ref=e4245]: 历史表征对照检验了部署学生的输入设计：输入—响应历史包含可读出的对象时延线索，但当前 SAE 压缩没有提高闭环通过率，统一学生继续保留原始历史。长时响应中的残余振荡还说明，跟踪门限与抑振性能需要分别检验。
    - paragraph [ref=e4246]: 下一步是把这条链路推到执行机构与实际接机上：执行机构参数敏感性给出控制权限的适用区间，滚转—偏航耦合给出多轴条件下的边界。
