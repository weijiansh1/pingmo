    - paragraph [ref=e3957]: 本文按 50 个对象展示逐对象教师训练，现有记录中 46 个通过项目设定的 RMSE、峰值误差和请求力总变差率门限。未通过记录包括 主试验对象 1、主试验对象 2、主试验对象 3。
