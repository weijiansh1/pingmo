    - heading "5.2 第二步：逐对象教师训练" [level=3] [ref=e3929]
    - paragraph [ref=e3930]: 本文按 50 个对象展示逐对象教师训练，现有记录中 46 个通过项目设定的 RMSE、峰值误差和请求力总变差率门限。未通过记录包括 主试验对象 1、主试验对象 2、主试验对象 3。
    - figure "图 6 教师跟踪误差与滚转操纵效能的关系（双对数）。颜色表示品质等级，红叉表示未通过对象；虚线为通过样本的拟合，相关系数 r = −0.74。" [ref=e3931]:
