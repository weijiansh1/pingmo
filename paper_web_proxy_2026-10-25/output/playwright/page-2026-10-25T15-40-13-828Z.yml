    - paragraph [ref=e4197]: 为此，在已蒸馏的 tiny 学生基础上比较原始历史、稠密编码和稀疏自编码器（SAE）。分析依次回答三个问题：时延信息能否从历史中读出，压缩表征能否维持闭环性能，以及表征改变后为何出现长时响应差异。SAE 在这里用于检验学生的历史输入设计。
