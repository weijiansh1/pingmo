    - heading "5.3.1 代表性闭环响应" [level=3] [ref=e3975]
    - paragraph [ref=e3976]: 图 10 把教师与学生放在同一组指令下对比。六档阶跃上两者的上升段几乎重合，学生的稳态跟踪误差约为教师的 2.3–3.3 倍；双脉冲与多正弦上倍数降到 1.5–1.9，但幅值衰减更明显——学生丢掉的正是教师从对象参数中读到的那部分动态信息。
    - figure "图 10 教师与学生的时域对比（主试验对象 7，同一组指令）。黑色点线为参考，蓝线为教师，橙线为学生；各面板标题中给出 2 s 后的跟踪 RMSE 及学生相对教师的倍数。六档阶跃上学生倍数约 2.3–3.3，形状指令上降到 1.5–1.9。" [ref=e3977]:
      - img "图 10 教师与学生的时域对比（主试验对象 7，同一组指令）。虚线为参考，蓝线为教师，橙线为学生；面板内给出 2 s 后的跟踪 RMSE 及学生相对教师的倍数。六档阶跃上学生倍数约 2.3–3.3，形状指令上降到 1.5–1.9。" [ref=e3978]
    - heading "5.3.2 跨对象闭环控制性能评估" [level=3] [ref=e3980]
    - paragraph [ref=e3981]: 为比较专用教师的跨对象迁移与统一学生的多对象能力保留，补充采用 12 个源对象的配对教师—学生组，三个品质等级各 4 个对象，进行三次训练重复。每组包含 12 个逐对象教师和一个蒸馏全部 12 位教师的 tiny 学生，采用该组冻结权重开展对照。
    - paragraph [ref=e3982]: 将每个教师依次用于全部 12 个对象，构成教师—对象矩阵：对角线为自身对象，非对角线为跨对象控制；统一学生作为末行，控制相同对象。迁移教师保持在 A 上训练所得权重，在 B 上接收 B 的真实参数与当前状态；学生仅接收普通观测与历史。每格使用同样的 18 条测试指令、8 s 闭环，按 RMSE ≤ 1.5 deg/s、峰值误差 ≤ 5 deg/s、请求力总变差率 ≤ 12 N/s 计通过。
