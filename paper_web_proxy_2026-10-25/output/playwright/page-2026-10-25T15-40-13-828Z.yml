    - heading "6.2 后续实验计划：执行机构敏感性" [level=3] [ref=e4789]
    - paragraph [ref=e4790]:
      - strong [ref=e4791]: 以下实验尚未开展，不属于本文结果。
      - text: 为检验当前执行机构设置是否影响策略表现，先在固定对象、随机种子和指令集上对现有策略做冻结权重敏感性扫描；若结果对参数明显敏感，再按相同训练预算分别重训 PPO，区分“环境变化造成的鲁棒性下降”与“策略能否适应新约束”。每次只改变一个因素，并同步记录教师验收率、RMSE、峰值误差、请求力总变差率、饱和比例，以及 DHC-6 适配组和留出组结果。
