    - heading "5.1 第一步：采样对象的分布覆盖" [level=3] [ref=e3921]
    - paragraph [ref=e3922]: 参数库共含 5,000 个对象：4,500 个构成训练及同分布对象池，500 个作为分布外集合。图 4 展示八维参数中两两组合的采样位置，图 5 展示各参数边际分布和已有记录的教师训练对象位置。覆盖范围由实验设计给定；库中 50 个对象训练了教师。
