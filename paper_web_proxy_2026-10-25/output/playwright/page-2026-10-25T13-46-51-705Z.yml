    - heading "6讨论" [level=2] [ref=e4125]
    - paragraph [ref=e4126]: 源域结果显示，49 个逐对象教师中多数达到项目门限；然而统一学生的 RMSE 中位数仍高于对应教师，且 4 个留出对象中仅 3 个通过。120 对象扩展抽样的通过率为 78.3%，幅值扫描则显示，±31 deg/s 阶跃通过率从同分布样本的 60.3% 降至 OOD 样本的 27.6%。在固定增益 PID 的对照中，学生策略在分布外对象上的退化幅度显著更小，但在同分布小幅值段的精度不及经过前馈整定的 PID。这些结果共同表明，蒸馏能够将策略压缩至数千参数并保留大部分常规响应能力，但学生策略对对象参数和指令幅值仍敏感。
    - paragraph [ref=e4127]: DHC-6 微调降低了 8 个适配状态和 4 个留出状态的 RMSE，但适配组改善大于留出组。两种容量的对比还说明，源域蒸馏对容量不敏感（1.28× 与 1.34×），但同一配方迁移到真实对象后，3,856 参数学生的适配后误差是 75,040 参数学生的 2.7 倍，且部分状态因更新顺序出现回退。这说明少量目标域数据可以在当前模型与测试条件下更新策略，。目标域对象由 DHC-6 仿真记录辨识得到的 ARX 模型表示；当前测试也未覆盖横航向耦合、状态估计误差和完整控制系统约束。
    - paragraph [ref=e4128]: 本文的飞行品质作用体现在源域对象参数化、等级覆盖和训练后门限评价。归档 PPO 奖励仍由跟踪误差、作用力能量和动作幅值构成，未逐项引入 GJB 条款指标。因此，当前证据支持的是“在飞行品质参数化对象上训练滚转控制器”，而不是“用 GJB 品质指标直接训练控制器”。若要验证后一目标，需将可计算的品质指标加入奖励或约束，并重新训练教师、蒸馏学生和实施目标域迁移；该扩展尚未完成。
    - heading [level=3] [ref=e4129]:
      - text: 6.1 延迟表征实验：稀疏自编码器能否提取 τ
      - subscript [ref=e4130]: p
    - paragraph [ref=e4131]:
      - text: 策略输入采用 32×5 历史，前提是历史中确实带有对象时延的信息。本节在固定 tiny 学生与 510 个分层对象上回答两个问题： τ
      - subscript [ref=e4132]: p
      - text: 能否从历史中读出，以及 16 维紧凑潜码能否替代原始历史作为输入。
    - heading "6.1.1 数据、表征与探针" [level=4] [ref=e4133]
    - paragraph [ref=e4134]:
      - text: 从 IV-A 对象库的 train_core、validation、id_test 三个互不重叠的划分中，按 τ
      - subscript [ref=e4135]: p
      - text: 分三层各抽 100、30、40 架，共 510 架；每架运行 8 条指令（±1、±2、±5、±10、±21、±31 deg/s 阶跃、双脉冲和多正弦），由 tiny 学生闭环驱动，记录 32×5 历史、当前量、旧动作和动作，共 489,600 个窗口。留出集为 120 架、960 个“对象—指令”episode。
    - paragraph [ref=e4136]:
      - text: 这里的 τ
      - subscript [ref=e4137]: p
      - text: 是对象输入前的
      - strong [ref=e4138]: 纯运输延迟
      - text: （代码级 FIFO，模拟 e
      - superscript [ref=e4139]:
        - text: −τ
        - subscript [ref=e4140]: p
        - text: s
      - text: ），用于构造延迟分层压力测试；它
      - strong [ref=e4141]: 不是
      - text: GJB 2874-1997 表 A21 的拟合等效延迟 τ
      - subscript [ref=e4142]: e
      - text: ，不能按 0.10/0.20/0.25 s 给对象打 GJB 延迟等级。两者的完整边界、4 阶 LOES 结构和为什么训练只能用 τ
      - subscript [ref=e4143]: p
      - text: ，见 6.1.4。
    - paragraph [ref=e4144]:
      - text: SAE 输入为 160 维展平历史，编码器为 160→64→16，分别采用 L1 稀疏或 top-k 稀疏，解码器对称；训练后冻结，只训练延迟读出或策略头。对照表征包括原始历史 160 维、PCA-16、稠密 AE-16、36 维请求力—响应互相关，以及 5 维通道均值。延迟探针使用因果前缀：从 1.2 s 起，对截至当前时刻的窗口运行平均后做线性回归，预测 τ
      - subscript [ref=e4145]: p
      - text: ；训练、验证、测试按对象划分，避免同一架飞机的窗口泄漏。
    - figure "图 16 延迟表征实验的两条前端：部署学生使用原始 32×5 历史（上）；实验分支将历史送入冻结 SAE，得到 16 维稀疏潜码，再分别接策略头或线性延迟探针（下）。SAE 只做表征，策略/探针在冻结潜码上训练；对照包括 PCA、稠密 AE、原始历史和互相关。" [ref=e4146]:
