      - img "图 21 τe 评价的策略种子稳健性。(a) 两个种子共同可评对象的逐对象 τe；(b) 两个种子的 A21 等级分布。" [ref=e4516]
    - paragraph [ref=e4518]:
      - text: 两个种子的结果基本一致。原始历史可评数 73 → 77，τ
      - subscript [ref=e4519]: e
      - text: 中位 0.073 → 0.078 s，共同可评集 73 架的中位 0.073 → 0.075 s，等级分布 43/15/4/11 → 43/15/5/14。SAE-aux 可评数 102 → 106，中位 0.102 → 0.106 s，共同 101 架中位 0.100 → 0.095 s，等级分布 51/14/7/30 → 52/15/7/32。
    - paragraph [ref=e4520]:
      - text: Top-k SAE 两个种子均为 0/120 可评，说明它的
      - code [ref=e4521]: not_assessable
      - text: 不是某一策略种子的偶然。由此可以认为：6.1.5 的 τ
      - subscript [ref=e4522]: e
      - text: 量级、延迟分层的单调趋势，以及 Top-k SAE 的拟合失败，在“两个种子 × 三档幅值”的范围内是稳健的；但这不是多源、多机型或 GJB 审定意义上的统计置信度。
    - figure "图 22 Top-k SAE 与原始历史的 180 s 闭环响应（id_test-3458，每分量 1 deg/s）。(a) 时域响应；(b) 功率谱。Top-k SAE 在 0–3 Hz 的低频段功率明显更高，说明其闭环响应不是单纯的延迟增大，而是伴随持续低频振荡/非线性，导致 4 阶 LOES 拟合失败。" [ref=e4523]:
      - img "图 22 Top-k SAE 与原始历史的 180 s 闭环响应（id_test-3458，每分量 1 deg/s）。(a) 时域响应；(b) 功率谱。Top-k SAE 在 0–3 Hz 的低频段功率明显更高，说明其闭环响应不是单纯的延迟增大，而是伴随持续低频振荡/非线性，导致 4 阶 LOES 拟合失败。" [ref=e4524]
    - heading "6.2 后续实验计划：执行机构敏感性" [level=3] [ref=e4526]
    - paragraph [ref=e4527]:
      - strong [ref=e4528]: 以下实验尚未开展，不属于本文结果。
      - text: 为检验当前执行机构设置是否影响策略表现，先在固定对象、随机种子和指令集上对现有策略做冻结权重敏感性扫描；若结果对参数明显敏感，再按相同训练预算分别重训 PPO，区分“环境变化造成的鲁棒性下降”与“策略能否适应新约束”。每次只改变一个因素，并同步记录教师验收率、RMSE、峰值误差、请求力总变差率、饱和比例，以及 DHC-6 适配组和留出组结果。
    - table [ref=e4529]:
      - caption [ref=e4530]: 表 14 待开展的执行机构消融
      - rowgroup [ref=e4531]:
        - row [ref=e4532]:
          - columnheader "因素" [ref=e4533]
          - columnheader "当前基线" [ref=e4534]
          - columnheader "计划对照" [ref=e4535]
          - columnheader "目的" [ref=e4536]
      - rowgroup [ref=e4537]:
        - row [ref=e4538]:
          - cell "请求力限幅" [ref=e4539]
          - cell "±22 N" [ref=e4540]
