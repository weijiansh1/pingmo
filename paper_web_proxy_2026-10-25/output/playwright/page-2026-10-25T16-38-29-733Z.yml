    - heading "5.3.2 跨对象闭环控制性能评估" [level=3] [ref=e4002]
    - paragraph [ref=e4003]: 为比较专用教师的跨对象迁移与统一学生的多对象能力保留，补充采用 12 个源对象的既有配对教师—学生权重，三个品质等级各 4 个对象，共三组训练重复。每组包含 12 个逐对象教师和一个蒸馏全部 12 位教师的 tiny 学生，评估时全部权重冻结。矩阵纳入该组全部教师训练实例。
    - paragraph [ref=e4004]: 将每个教师依次用于全部 12 个对象，构成教师—对象矩阵：对角线为自身对象，非对角线为跨对象控制；统一学生作为末行，控制相同对象。迁移教师保持在 A 上训练所得权重，在 B 上接收 B 的真实参数与当前状态；学生仅接收普通观测与历史。每格使用同样的 18 条测试指令、8 s 闭环，按 RMSE ≤ 1.5 deg/s、峰值误差 ≤ 5 deg/s、请求力总变差率 ≤ 12 N/s 计通过。
    - figure "图 11 专用教师跨对象控制与统一学生的多对象控制。矩阵每格为三次训练重复的平均通过率，右侧点标出各次结果，横线为平均值；各次训练重复的完整矩阵见补充数据。 对象与其专用教师按 1–12 对应编号。" [ref=e4005]:
