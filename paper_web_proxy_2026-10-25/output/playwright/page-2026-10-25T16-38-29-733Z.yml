    - paragraph [ref=e4843]: 两个种子和三档幅值下，Top-k SAE 的长时动态问题均出现；图 22 给出同一对象上的响应实例。综合探针与闭环结果，历史确实提供了对象时延线索，但当前 SAE 压缩方式没有改善统一控制。主线因此保留原始历史：后续表征设计应以维持跟踪、抑制振荡和跨对象控制能力为目标，再检验可解释特征是否带来额外收益。
