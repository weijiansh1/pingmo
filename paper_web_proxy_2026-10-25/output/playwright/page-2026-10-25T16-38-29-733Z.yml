  - main [ref=e35]:
    - heading "基于飞行品质模型的飞控大模型研究" [level=1] [ref=e36]
    - generic [ref=e37]: 研究论文 · 版本日期：2026-10-24
    - generic [ref=e38]: 摘要 滚转控制律通常按单一机型整定，换型需重新设计。本文把飞行品质分级直接当作训练对象分布，构建一条可复用的链路：5,000 个品质参数化对象 → 50 个 PPO 教师 → 一个统一学生 → DHC-6 仿真适配。统一学生 3,856 参数，机载 CPU 单核可推理；在 800 个对象 × 14 条指令的扫描中，±1 deg/s 阶跃通过率 99.7%，±31 deg/s 通过率 60.3%，大幅值与分布外参数是明确的失效边界。学生相对教师的中位误差为 1.28 倍（同分布）与 1.68 倍（留出）；把容量放大 20 倍只把该比值改为 1.34 倍，说明差距来自教师可见的对象参数，而非网络容量。目标域用 40 步微调，把适配状态中位误差由 2.91 降至 0.59 deg/s（−79.6%），未参与更新的留出状态由 2.66 降至 2.15 deg/s。32×5 历史还可在 1.2 s 内以 R² = 0.995 解出输入时延，为策略输入的形式选择提供了依据。
    - generic [ref=e39]: 关键词 飞行品质；低阶等效系统；强化学习；教师—学生蒸馏；DAgger；迁移学习
    - heading "1引言" [level=2] [ref=e40]
    - paragraph [ref=e41]: 飞行控制系统的闭环性能由被控对象、执行机构与控制律共同决定。本文处理控制器层面的滚转角速度内回路：保留滚转对象与执行机构，用强化学习策略替换原控制律。策略完成观测到力速率的映射，力经接口模块积分、限幅并映射为副翼偏角，因此同一策略可以直接接入既有飞控接口。
    - paragraph [ref=e42]: 本文的路线分四步：品质分级采样、逐对象教师、单学生蒸馏、目标域微调。每一步都有独立的验收门限，前三步在品质参数化对象族上完成，第四步用有限的 DHC-6 仿真记录把学生接到具体机型上。最终产物是一个 3,856 参数、可在机载 CPU 上运行的控制器。
    - paragraph [ref=e43]: 本文处理滚转角速度内回路，对应 GJB 185 对滚转模态的响应要求，文中门限即为该回路的验收条件。奖励由跟踪误差、操纵能量与动作幅值三项构成，分别对应品质评定中的跟踪精度、操纵功率与平滑性；GJB 条款则以门限形式用于训练后的验收。
    - heading "1.1 相关工作" [level=3] [ref=e44]
    - paragraph [ref=e45]:
      - text: 飞行品质与低阶等效系统。飞行品质规范以低阶等效系统评定高阶对象的响应形态，并按等效参数分级
      - superscript [ref=e46]: "[1,2]"
      - text: 。这提供了一种把“一类飞机”组织成参数族的方式：对象不是某一架具体飞机，而是满足同一组 品质判据的参数集合。已有飞控设计多在单架飞机上完成增益调度，把品质分级直接当作训练对象分布的做法并不常见。
    - paragraph [ref=e47]:
      - text: 特权信息与教师—学生蒸馏。训练期可用、部署期不可用的信息被称为特权信息 （learning using privileged information）
      - superscript [ref=e48]: "[5]"
      - text: ；在强化学习中对应 asymmetric actor–critic
      - superscript [ref=e49]: "[6]"
      - text: ，教师使用完整状态、学生只部署可观测输入。足式机器人上的工作把这一范式做成了完整链路
      - superscript [ref=e50]: "[7,8]"
      - text: ，快速运动自适应则用环境参数编码器显式推断特权量
      - superscript [ref=e51]: "[9]"
      - text: 。这些工作报告的是 “学生接近教师”，但较少量化信息差的大小，也很少给出学生失效的参数区间。
    - paragraph [ref=e52]:
      - text: 学习飞行控制。端到端学习已在竞速无人机
      - superscript [ref=e53]: "[10]"
      - text: 与强风条件下的四旋翼
      - superscript [ref=e54]: "[11]"
      - text: 上展示能力，Learning-to-Fly 一类工作则强调在仿真中快速得到可部署策略
      - superscript [ref=e55]: "[12]"
      - text: 。它们通常面向单一平台或在线自适应，目标域数据来自真实飞行；本文面向的是 品质分级对象族上的离线蒸馏，并用少量目标域记录完成适配。
    - paragraph [ref=e56]: 本文将飞行品质分级用于构造对象族，以逐对象强化学习教师形成控制经验，再经多轮蒸馏得到统一学生。评价围绕三个问题展开：统一策略能保留多少教师能力，输入历史能否支持不同对象的控制，以及性能随指令幅值和对象分布如何变化。容量、对象覆盖和历史表征对照用于分析学生的误差来源。
