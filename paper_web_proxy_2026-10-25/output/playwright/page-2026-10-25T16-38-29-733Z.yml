    - heading "5.3.5 历史表征方式的消融" [level=3] [ref=e4140]
    - paragraph [ref=e4141]: 前述跨对象测试显示，统一学生保留了多对象控制能力，但其误差仍随对象动态变化。本节按第 3.3.1 节的设计，检验由历史重构学习得到的冻结表征，能否替代面向控制任务学习的时序特征。采用 510 架分层对象和 489,600 个历史窗口，按对象划分训练、验证与测试，其中 120 架对象用于留出评价。
    - paragraph [ref=e4142]:
      - text: 首先，历史中确实含有时延线索：1.2 s 因果前缀上的请求力—响应互相关达到 R² = 0.995、MAE = 2.9 ms；稠密 AE-16 的 R² 为 0.608，Top-k SAE（k=4）为 0.122。当前稀疏编码保留的线性可读出时延信息较少，完整探针对照见
      - link "附录 A.2" [ref=e4143] [cursor=pointer]:
        - /url: "#s612"
      - text: 。
    - paragraph [ref=e4144]: 闭环对照见图 14。在长延迟层，保留原始历史的学生通过率为 90.0%，附加 SAE 潜码后仍为 90.0%；直接替换历史时，PCA-16、稠密 AE-16、Top-k SAE-16 分别为 51.6%、63.7%、71.9%。Top-k SAE 的闭环表现优于其他替换方案，但其时延探针分数更低，说明单个对象参数的可读出性不足以决定控制效果。
    - figure "图 14 闭环对照。(a) 各策略在短/中/长延迟层的通过率（120 架留出，960 episode）；(b) 仅用短/中延迟样本再训练后，长延迟留出的通过率与全延迟训练的对比。raw 与 SAE-aux 保持 90%，PCA 与 Top-k SAE 明显下降。" [ref=e4145]:
      - img "图 14 闭环对照。(a) 各策略在短/中/长延迟层的通过率（120 架留出，960 episode）；(b) 仅用短/中延迟训练后，长延迟留出的通过率与全延迟训练的对比。raw 与 SAE-aux 保持 90%，PCA 与 Top-k SAE 明显下降。" [ref=e4146]
    - paragraph [ref=e4148]:
      - text: 这组结果支持当前统一学生保留由控制任务学习的历史编码分支：现有 SAE 替换方案损失了部分控制能力，辅助输入方案维持基线表现，尚未带来通过率收益。历史特征的取舍需要以闭环表现为依据。完整训练对照及长时闭环诊断见
      - link "附录 A.3–A.6" [ref=e4149] [cursor=pointer]:
        - /url: "#s613"
      - text: 。
    - heading "5.4 第四步：DHC-6 仿真目标上的小样本微调" [level=3] [ref=e4150]
    - paragraph [ref=e4151]: 在相同 15 deg/s 阶跃、8 s 评价时域及 ARX 目标模型下，8 个适配状态的 RMSE 中位数由 2.913 降至 0.595 deg/s，4 个留出状态由 2.662 降至 2.148 deg/s。适配状态降低 79.6%，未参与更新的留出状态降低 19.3%：微调同时给出拟合收益与跨状态泛化收益，前者更大是预期行为。
    - paragraph [ref=e4152]: 同一配方用于 3,856 参数 tiny 学生，得到一条明确的容量分工：源域蒸馏对容量不敏感（同分布 1.28× 对 1.34×）， 目标域适配对容量敏感——tiny 适配后为 1.57 deg/s，small 为 0.59 deg/s，相差 2.7 倍。据此本文的部署建议是 “源域用 3,856 参数、目标域用 75,040 参数”：前者负责通用律，后者负责机型适配。更新预算同样影响结果： 40 步内每个适配状态只被访问 5 次，初始性能已较好的状态会被后访问的状态拉走，扩大步数即可缓解。
