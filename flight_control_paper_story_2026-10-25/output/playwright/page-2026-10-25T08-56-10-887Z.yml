      - text: 原扫描件印刷 211 页公式及 212 页响应支持式 (2) 的单个原点零点，印刷 236 页另出现分子 s² 与时延排印差异。本研究采用单 s 和因果时延，并以 NASA-TM-110306 式 (2.15) 交叉核对；这是明确的建模选择，不是官方勘误。
