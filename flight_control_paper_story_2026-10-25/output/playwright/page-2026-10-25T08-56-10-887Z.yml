    - heading "B.2 当前对象库遗漏了什么" [level=3] [ref=e3782]
    - paragraph [ref=e3783]: 对原 5,000 对象的覆盖统计不改变历史参数或实验划分。4,500 个非 OOD 对象只覆盖 8 种四分量等级组合；全库两项及以上已分级指标同时退化的对象为 0。零点、增益和时延仍有变化，所以这不等于全库只有 8 个不同动力学；但总等级均衡不能代表联合退化覆盖。
    - paragraph [ref=e3784]: 库中还缺少“荷兰滚二级、频率≥1 rad/s”的分支以及 0.20<τ_p≤0.25 s 的区间。名为 train_boundary 的分组未按真实阈值距离选点；500 个 OOD 中有 160 个仅因增益越界，OOD 不自动表示品质更差。旧 R_ω 域外采样实际范围约为 [0.30,0.424] 与 [2.121,3.0]，与名义区间不同。
    - paragraph [ref=e3785]:
      - text: 旧建库记录只长 0.75 s，考虑时延后全部不足一个完整荷兰滚周期。辅助振荡比有 4,358 个被记为 0、641 个记为 1，调节时间有 4,999 个记为 0.749 s；这些数值来自不合适的峰值与截尾处理，不能用作无振荡或已经稳定的证据。新的主结果使用完整指令响应和显式恢复评价，不使用这些辅助值作闭环合格判断。已知两条一秒灵敏度边界标签变化在
      - link "覆盖记录" [ref=e3786] [cursor=pointer]:
        - /url: evidence/gjb_audit/coverage.json
      - text: 中另列。
    - paragraph [ref=e3787]:
      - text: 已经构造的 190 对象样例以 3×3×3×2=54 格分量组合组织训练、验证和 ID 各 54 个对象，另有 14 对位于活动阈值 ±2% 的边界探针。其中 138 个至少两项退化，44 个覆盖高频二级荷兰滚，39 个位于 0.20–0.25 s 时延段。
      - link "构造清单" [ref=e3788] [cursor=pointer]:
        - /url: evidence/gjb_audit/pilot_joint_v1/manifest.json
      - text: 和
      - link "238 项数值检查" [ref=e3789] [cursor=pointer]:
        - /url: evidence/gjb_audit/verification.json
      - text: 可复算。该样例尚未经过策略训练，也尚未证明物理可实现性和任务可达性；它与产生本文控制结果的历史对象库严格区分。
    - heading "附录 C 数据、版本与复现入口" [level=2] [ref=e3790]
    - paragraph [ref=e3791]: 本文主结果仅使用 controller-route-v1：12 个源对象、三个策略种子、同一 3,856 参数学生与 64 次目标更新。早期交付中的 49/46 教师、75,040 参数 small 学生、不同轮次迁移以及 SAE/延迟探针属于其他实验，未纳入本文主表，也未据此扩大结论。原稿及完整核查材料保留在此前版本目录，本次重写没有新增训练或改动冻结结果。
