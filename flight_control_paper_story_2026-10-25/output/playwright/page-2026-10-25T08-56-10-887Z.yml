    - heading "6 讨论：当前价值与尚缺的证据" [level=2] [ref=e2404]
    - heading "6.1 控制经验已经可复用，成本收益仍需完整计量" [level=3] [ref=e2405]
    - paragraph [ref=e2406]: 本实验最清楚的发现是：即使源域零样本控制和蒸馏保留还不充分，源域学生仍可作为目标优化的有用起点。小型策略可以同时承担统一控制接口和预训练初始化两个角色。对于后续多个目标，源域训练成本是否能够摊薄，取决于实际复用次数、每次适配成本和所需控制质量。
    - paragraph [ref=e2407]: 因此，当前可陈述的收益是固定目标预算下的通过率提高。要进一步声称减少目标数据、缩短适配时间或降低总成本，需要预先固定性能目标，扫描目标数据量与更新次数，并把源域教师训练和蒸馏成本计入。当前只有三个种子和一套目标辨识配方，收益的可重复范围仍需扩大。
    - heading "6.2 品质组织需要成为可验证的贡献" [level=3] [ref=e2408]
    - paragraph [ref=e2409]: 品质相关参数把训练对象与控制困难联系起来，这是这条路线值得研究的特点。但当前对象库的大部分分级组合只让单项指标退化，多项困难叠加的覆盖不足；全库统计也不能代表本次 12 个源对象实际提供了哪些经验。因此，现阶段不能把“采用品质标签”写成已经证明的泛化优势。
    - paragraph [ref=e2410]: 最能检验这一设计的实验，是在相同教师数、对象范围和训练预算下，比较品质组织与一般参数采样，并在预先留出的联合退化、边界和目标工况上评价。进一步将源对象覆盖特征与失败类型配对，才能判断品质信息是否使有限训练资源更有效。新构造的 190 对象样例改善了组合与边界的显式覆盖，但尚未训练，不能用于解释现有学生的性能。
    - heading "6.3 可靠性要求训练任务和使用任务一致" [level=3] [ref=e2411]
    - paragraph [ref=e2412]: 目前教师优化有限 8 s 跟踪代价；恢复、持续控制和对象级全指令通过率揭示了额外要求。下一阶段应先定义与模型和输入能力相容的有限滚转机动、反向指令及长时恢复任务，再固定评价和训练目标。长时间恒定滚转速率还涉及累计姿态变化，超出了局部滚转模型能充分描述的范围。
    - paragraph [ref=e2413]: 算法方面，需要分别比较同容量有/无特权教师、直接训练统一策略与教师—学生路线、等计算量 BC 与迭代采样，以及不同学生容量和历史长度。它们回答不同问题，不能由一次端到端适配收益反推每个环节都必要。全部比较应保留难对象、种子差异和失败案例，以避免平均指标掩盖恢复受损。
    - heading "7 结论" [level=2] [ref=e2414]
    - paragraph [ref=e2415]: 本文考察以品质相关对象族组织离线训练、以特权教师和迭代蒸馏形成小型共享控制器、再向新目标适配的飞控构建路线。滚转验证表明，3,856 参数学生可以承接多个源对象的控制经验；在当前 DHC-6 辨识仿真和相同目标预算下，三个种子的预训练适配均优于从零训练，留出工况通过率提高 11.1–19.4 个百分点。这为控制经验复用提供了直接证据。
    - paragraph [ref=e2416]: 路线仍受教师质量、蒸馏损失、源域覆盖和任务定义限制，零样本可靠性与恢复能力尚不充分。下一步的关键是用受控实验确定品质组织和训练分解是否带来独立收益，并在可达任务、完整闭环及真实平台上验证这些收益能否延续。
