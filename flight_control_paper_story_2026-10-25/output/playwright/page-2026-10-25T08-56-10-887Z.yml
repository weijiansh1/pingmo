    - paragraph [ref=e1967]: 式 (6) 的误差、施加力和动作由辨识模型闭环生成，沿用源域三项代价，但在目标适配中使用未折扣的均值。目标损失覆盖完整 8 s 可微轨迹；每个工况更新 8 次，梯度范数上限为 1，固定第 64 次更新后的模型进行评价。每个可训练组经历 819,200 次模型内状态转移。这是基于辨识模型的梯度适配；“相同预算”指目标数据和目标更新预算相等，预训练组另外承担源域离线学习成本。
    - paragraph [ref=e1968]: 目标接口沿用源域的观测结构、增量力动作和输入限制。施加力按 −10/22 deg/N 映射为副翼偏角；ARX 以实际副翼量辨识，模型内不重复加入执行机构。目标误差积分采用 50 Hz 梯形近似，源域采用 1 kHz 区间积分。评价采用独立记录辨识的模型，留出工况不用于策略更新。
    - heading "4 实验设计" [level=2] [ref=e1969]
    - paragraph [ref=e1970]: 实验按四个问题组织：源经验能否改善目标适配；教师能力能否被小型学生承接；迭代后能否覆盖未见对象；控制器能否完成跟踪之外的持续控制和恢复。全部主要结果来自训练前冻结的 controller-route-v1 协议，三个策略种子为 20261031、20261101、20261102，以下简写为 S1、S2、S3。协议、逐轮记录及汇总数据均随文提供。
