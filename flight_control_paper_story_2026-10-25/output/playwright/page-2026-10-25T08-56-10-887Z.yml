    - paragraph [ref=e1310]: "1.76 N 来自 88 N/s 的速率上限乘以 20 ms 控制周期；执行机构为时间常数 20 ms 的一阶环节。奖励使用动作执行后同一时刻的参考和输出，即 e_{k+1}=p_ref,k+1−p_k+1；下一个观测也对齐到该时刻。三项分别惩罚跟踪误差、施加力和力速率动作，权重体现当前配方的折中。它并未直接约束全部模态品质或长时稳定性，因此恢复任务另作测试。"
    - paragraph [ref=e1311]:
      - text: 教师最大化有限 8 s 任务内的折扣回报，使用 PPO 和 GAE
      - superscript [ref=e1312]: "[17,18]"
      - text: 。Critic 估计未来回报，GAE 将一步预测残差组合为优势；PPO 限制每次更新对既有样本动作概率的改变。精确目标、终止语义和超参数见附录 A。特权量为教师提供更多仿真信息，但本实验未隔离其相对无特权训练的因果收益。
