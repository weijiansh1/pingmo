    - paragraph [ref=e2362]: 通过率按全部 216 个相同对象—指令配对统计。RMSE 比值仅在教师 RMSE≥0.05 deg/s 且双方有限时计算，每种子 214 对，以避免接近零的分母主导比值。三个种子的学生整体平均 RMSE 均下降，但逐案例 RMSE 比值的中位数均大于 1；两种统计描述不同。尤其 S3 有 18 个案例从不通过变为通过、46 个反向变化，显示平均误差改善可以伴随通过率下降。
    - paragraph [ref=e2363]: 要求一个对象的全部 18 条指令都通过时，教师分别为 8/12、4/12、4/12，学生为 6/12、0/12、0/12。因此，结果支持“小型统一学生可承接多个对象的部分控制能力”，同时表明能力保留尚不稳定。教师本身的种子差异和未通过案例也限制了可蒸馏的监督质量。
    - heading "5.3 多轮闭环采样改善验证误差，收益不随轮数单调增加" [level=3] [ref=e2364]
    - paragraph [ref=e2365]: 图 3 展示初始 BC 和全部六轮重新采样后的源对象验证误差。最优轮次分别是第 6、5、4 轮；相应平均 RMSE 从 4.668、6.895、10.908 deg/s 降至 0.960、1.380、2.088 deg/s。S2 和 S3 的最后一轮都不是最佳轮次，S3 在中间轮次也发生反弹。
