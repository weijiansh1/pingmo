  - main [ref=e81]:
    - heading "从品质相关对象族到可复用飞控控制器：特权学习、迭代蒸馏与小样本适配" [level=1] [ref=e82]
    - paragraph [ref=e83]: 滚转通道可行性研究 · 2026-10-25
    - heading "摘要" [level=2] [ref=e84]
    - paragraph [ref=e85]: 面对动力学不同的新对象，飞控策略能否复用已有控制经验，在有限目标数据和更新预算下获得更好的控制效果？本文研究一条以飞行品质相关参数组织源域、以教师—学生学习实现策略复用的控制器构建路线。首先，以滚转、螺旋和荷兰滚等响应特征构造参数化对象族；随后，为各源对象训练可读取仿真内部信息的专用强化学习教师；再通过学生闭环采样与教师重新标注，将多教师策略合并为仅使用部署观测及其历史的统一学生；最后，在新目标的辨识模型上进行小样本适配。该设计旨在将跨对象的学习成本放在离线阶段，使部署模型同时具备较小规模和可复用的初始化。
    - paragraph [ref=e86]: 在训练前冻结的 12 个源对象、24 个同分布留出对象、24 个分布外对象及三个策略种子上，本文完成了 36 个教师和三个 3,856 参数学生的连续验证。相对单个教师 Actor，学生参数量约缩小 1,104 倍。最直接的复用证据来自 DHC-6 仿真记录辨识的 ARX 目标：在相同的 240 s 目标辨识数据和 64 次目标更新下，预训练后适配的留出工况通过率为 75.0%、75.0%、80.6%，高于从零训练的 58.3%、63.9%、61.1%，分别提高 16.7、11.1、19.4 个百分点。源域蒸馏和零样本泛化存在明显种子差异，长时控制及扰动恢复也出现失败。结果支持当前仿真配方下“将源域经验转化为有用适配起点”的可行性；品质组织、特权信息和迭代蒸馏各自的独立收益仍需消融验证。
    - paragraph [ref=e87]:
      - strong [ref=e88]: 关键词：
      - text: 飞控控制器；飞行品质；策略复用；特权强化学习；迭代蒸馏；目标域适配
    - heading "1 引言" [level=2] [ref=e89]
    - paragraph [ref=e90]:
      - text: 飞控控制器既要完成指令跟踪，又要使指令变化、初始偏差和外部扰动后的响应可接受。对象的响应速度、振荡特性、控制效能和时延发生变化时，已有控制器在新对象上的表现需要重新验证。本文关注由此产生的一个具体问题：
      - strong [ref=e91]: 能否把多个源对象上的控制经验保存在一个小型策略中，使新对象在有限适配预算下受益？
      - text: 这一问题把控制器的评价从“在一个对象上能否训练成功”，推进到“已经付出的学习成本能否在后续对象上复用”。
    - paragraph [ref=e92]: 策略复用面临两个相互关联的困难。第一，不同对象所需的控制动作可能不同，训练必须提供足够丰富且有控制意义的动力学变化。第二，训练仿真可以提供真实参数和内部状态，实际控制器通常只能根据可获得的信号作决策。逐对象策略能够分别学习控制，但部署时需要确定使用哪一个策略；统一策略便于部署，却必须从有限观测中应对对象差异。仅将若干网络合并，并不能保证这些困难已经解决。
    - paragraph [ref=e93]: 本文的思路是把动力学覆盖、控制学习和部署压缩连接起来。飞行品质相关参数为源对象提供共同的响应描述，使训练对象能够按“响应快慢、振荡衰减、发散趋势”等控制问题组织。专用教师利用仿真内部信息学习各对象的控制行为，为统一学生提供动作监督。学生在自身闭环访问的状态上反复获得教师指导，并通过观测历史利用对象对动作的响应。最终，学生权重成为新目标适配的起点。这里的历史输入服务于对隐藏动力学的间接判断，其充分性需要实验检验。
    - paragraph [ref=e94]: 这条路线的价值应体现在两个可测结果上：一个小型学生能够在多个对象上闭环工作；已有训练能够改善固定目标预算下的适配表现。前者回答部署形式是否可行，后者回答源域经验是否值得保留。本文把两者与可靠性分别评价：参数量下降不等于控制无损，目标适配收益也不等于所有新对象都能直接使用。
    - paragraph [ref=e95]: 现阶段采用滚转角速度通道作为路线的验证入口。该任务包含响应速度、振荡模态、时延与输入约束，能够检验教师学习、学生信息限制和目标适配之间的衔接。研究主体是飞控控制器的构建与复用；对象模型为其提供训练环境。当前结论覆盖参数化滚转对象及 DHC-6 辨识仿真，尚不覆盖完整飞机闭环和实飞。
    - paragraph [ref=e96]: 本文的工作包括：建立品质相关对象族、专用教师、统一学生和目标适配之间一致的控制接口；在对象与指令隔离、三个独立策略种子的协议下检验能力传递；以相同目标数据、网络和更新预算的对照测量预训练收益，并报告零样本泛化和恢复任务中的失败。PPO、特权学习和 DAgger 均使用已有方法；本研究考察它们在这一控制器复用问题中的组合及证据边界。
    - heading "2 相关工作与研究位置" [level=2] [ref=e97]
    - heading "2.1 飞行品质为训练对象提供什么" [level=3] [ref=e98]
    - paragraph [ref=e99]:
      - text: GJB 2874—1997 的飞行品质条款及低阶等效系统描述，为理解滚转响应和相关模态提供依据
      - superscript [ref=e100]: "[1]"
      - text: 。Davidson 与 Andrisani 讨论了传递函数、模态与响应之间的关系
      - superscript [ref=e101]: "[2]"
      - text: ；Morelli 的 LOES 辨识以驾驶操纵和飞机响应为输入输出，描述中可以包含机体与控制系统的共同作用
      - superscript [ref=e102]: "[3]"
      - text: 。这些工作提示：对象族应同时说明极点、零点、控制接口和评价条件，单个阻尼值不能完整决定可见响应。
    - paragraph [ref=e103]:
      - text: 强化学习与航空品质评价已有直接联系。例如，Jansen 与 van Kampen 研究 SAC 飞控的纵向操纵品质评价
      - superscript [ref=e104]: "[4]"
      - text: ；Bøhn 等研究固定翼姿态控制的仿真到实飞迁移
      - superscript [ref=e105]: "[5]"
      - text: 。本文将品质相关描述放在源对象组织环节，尝试为跨对象学习提供可解释的变化维度。标准中的边界并不自动给出真实机队的采样分布，也不使训练奖励自动成为完整品质评价。
    - heading "2.2 特权学习、历史适应与小型通用策略" [level=3] [ref=e106]
    - paragraph [ref=e107]:
      - text: LUPI 与广义蒸馏区分训练时可用的信息和部署时可用的信息
      - superscript [ref=e108]: "[6,7]"
      - text: 。Asymmetric actor–critic 将更完整的信息供给 Critic，而 Actor 使用部署观测
      - superscript [ref=e109]: "[8]"
      - text: ；本文还让专用教师 Actor 读取对象参数和内部状态，再向无显式特权输入的学生传递动作监督。因此，本文同时涉及信息条件变化与模型压缩。
    - paragraph [ref=e110]:
      - text: RMA 和 Extreme Adaptation 利用历史信号形成对动力学的适应
      - superscript [ref=e111]: "[9,10]"
      - text: 。与本文链路最接近的 RAPTOR，为 1,000 个四旋翼对象分别训练教师，再蒸馏为 2,084 参数的循环学生，并在多个真实四旋翼上验证
      - superscript [ref=e112]: "[11]"
      - text: 。已有工作已经表明，多教师、小型统一策略和跨平台适应可以构成完整路线。本文需要回答的进一步问题，是以品质相关响应组织滚转对象后，控制经验能否成为新目标的有效适配起点。
    - heading "2.3 为什么需要学生闭环采样" [level=3] [ref=e113]
    - paragraph [ref=e114]:
      - text: Policy Distillation 将多个策略的行为转移到统一策略
      - superscript [ref=e115]: "[12]"
      - text: 。若监督数据只来自教师轨迹，学生执行误差可能使它访问训练集中较少出现的状态。DAgger 在学习策略访问的状态上追加专家标注，直接处理这种分布变化
      - superscript [ref=e116]: "[13]"
      - text: ；Distilling Policy Distillation 进一步讨论了采样分布与蒸馏目标的关系
      - superscript [ref=e117]: "[14]"
      - text: 。本文的“多轮”是多次闭环采样、标注和聚合，并非同一数据上的重复训练，也不是将上一代学生升级为下一代教师。Born Again Networks 与 Teacher Assistant KD 对应后两类蒸馏设计中的不同问题
      - superscript [ref=e118]: "[15,16]"
      - text: ，不构成本文迭代收益的证据。
    - paragraph [ref=e119]: 表 1 将方法动机与本文实际证据对应起来。品质组织和特权训练目前属于具有依据的设计选择；受控目标适配是本研究已经获得的效果证据。
