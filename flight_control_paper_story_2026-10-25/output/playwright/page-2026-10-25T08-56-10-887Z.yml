    - paragraph [ref=e2370]: 这些记录说明迭代链路能够运行，并观察到相对初始 BC 的改善。由于新增数据量和优化次数同时增加，目前不能把全部改善归因于学生采样本身；等计算量继续 BC 是区分机制所需的对照。现有结果也支持按预定验证规则停止，而不是默认使用最后一轮。
