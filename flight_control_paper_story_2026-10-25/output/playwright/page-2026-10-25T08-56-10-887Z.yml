    - paragraph [ref=e582]: 参数 θ=(L_Fa, λ_s, T_R, ζ_d, ω_d, R_ω, R_ζ, τ_p)，且 ω_φ=R_ωω_d、ζ_φ=R_ζζ_d。T_R 描述滚转模态时间尺度，λ_s 描述螺旋模态趋势，ζ_d、ω_d 描述振荡模态，L_Fa 和分子零点影响操纵效能及各模态在输出中的表现，τ_p 为纯传输时延。有理部分转换为四维状态空间，以 1 ms 步长离散推进，时延由队列实现。实现状态 x 并不直接等于真实飞机的 p、r、β、φ。
    - paragraph [ref=e583]: 这样的组织方式把“改变对象”转化为改变可解释的响应特征。例如，降低振荡模态的衰减率会增加恢复挑战，增加时延会改变反馈动作产生效果的时刻。教师在这些不同对象上学习，学生尝试从输入输出历史中适应差异。品质参数在这里提供训练空间的描述语言；是否比一般参数随机化更有效，仍是待检验的核心假设。
    - paragraph [ref=e584]: 本实验从已有 5,000 对象库中预先选择 12 个源对象，部分品质 L1/L2/L3 各 4 个，同时冻结 24 个 ID 与 24 个 OOD 对象。部分标签来自选定的滚转时间常数、螺旋、荷兰滚和一秒灵敏度判据，不能解释为整机 GJB 等级。源对象没有因教师表现不佳而被删除。对象库仍存在联合退化覆盖不足，具体限制及尚未训练的新构造样例列于附录 B。
    - paragraph [ref=e585]: 式 (2) 的操纵力—速率映射，与接入策略后的指令—闭环速率映射不同。当前等效 N 输入和附加执行机构是明确的研究接口。若后续使用已经包含原控制系统的辨识对象，必须重新核对控制边界，防止重复加入执行机构或原飞控效应。
    - heading "3.3 特权教师：在对象明确时学习控制" [level=3] [ref=e586]
