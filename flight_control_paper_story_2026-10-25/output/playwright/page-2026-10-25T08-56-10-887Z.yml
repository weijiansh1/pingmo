    - paragraph [ref=e2270]: 这些门限是项目评价规则，不是完整 GJB 品质等级。正式测试从指令起始响应覆盖到任务末状态；教师选模的验证窗口为 2.00–7.98 s，学生选模使用完整响应，这一差异保留并在解释中考虑。非有限输出或 |p|>300 deg/s 记为发散失败并截尾，截尾后不补零。通过率始终包含全部预定案例。
    - paragraph [ref=e2271]: 恢复评价将有控响应与施加相同初始偏差或输入脉冲的无控响应配对，测量释放后 RMS，并记录稳定时间是否在观察期内得到确认。RMS 同时包含偏差、漂移和振荡，不能直接等同模态阻尼。固定抗饱和 PID 在源对象验证指令上选参，最终 Kp=45、Ki=24、Kd=1，作为常规控制参照。
    - paragraph [ref=e2272]: 目标评价模型使用与策略拟合分离的 chirp 记录辨识，并用另外两类记录检验；24 次外部记录预测检验均满足预设 VAF≥85%。这支持当前辨识范围内的模型评价，不能代替在原始完整仿真器或实机上的闭环检验。三种子逐一报告；同一对象上的多条指令不被当作独立飞机样本。
