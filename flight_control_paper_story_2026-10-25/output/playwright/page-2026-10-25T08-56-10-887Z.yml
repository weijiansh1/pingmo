    - paragraph [ref=e2332]: 这些结果回答的是“固定目标预算下，源域经验是否有帮助”。本实验只测试一个目标数据量和一个更新预算，尚不能给出达到同等性能所节省的数据量、更新次数或总计算量。留出组通过率高于适配组也不意味着未见工况天然更容易适应；两组工况不同，不能把它们之间的差值作为适配收益。
    - heading "5.2 小型学生承接了多对象控制，但存在能力损失" [level=3] [ref=e2333]
