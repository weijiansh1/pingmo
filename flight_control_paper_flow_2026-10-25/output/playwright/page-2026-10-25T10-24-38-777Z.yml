    - paragraph [ref=e2555]: 在相同源对象和指令上，学生通过率相对教师分别变化 +4.63、+2.78、−12.96 个百分点。三个种子的整体平均 RMSE 均下降，但逐案例学生/教师 RMSE 比值的中位数为 1.140、1.027、1.324，均显示典型案例的精度损失。尤其 S3 中，18 个案例由不通过变为通过，46 个反向变化。因此，小型统一策略已经能够承接多个对象的控制，能力保留仍受种子和案例差异影响。比值分母规则与完整配对见附录 C.1。
    - paragraph [ref=e2556]: 学生在未参与训练的对象上仍具有部分控制能力，但通过率随对象组和种子变化。固定 PID 在 ID 和 OOD 上分别通过 232/432（53.7%）和 120/432（27.8%）个案例：三个学生的 OOD 通过率均更高，ID 仅 S1 更高。这里比较的是验证网格选出的固定 PID，不能外推为优于最优经典控制器。
    - paragraph [ref=e2557]: 更严格的对象级统计显示，S1 学生在源对象、ID、OOD 上分别有 6/12、6/24、5/24 个对象通过全部 18 条指令，S2 和 S3 三组均为零。案例平均值之下仍存在对象级失效，因而还需要检查恢复任务和更长时间运行中的表现。
