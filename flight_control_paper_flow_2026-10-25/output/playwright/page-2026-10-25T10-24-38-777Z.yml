    - paragraph [ref=e5791]: 这一诊断揭示任务设计与有限输入能力之间的冲突，但没有证明允许非零误差的项目门限一定不可满足，也不能解释全部恢复退化。它属于事后分析，没有用于删除案例或修改结果。长期恒定滚转速率还会造成持续姿态变化，后续应采用与模型适用范围一致的有限机动任务评价持续控制。
