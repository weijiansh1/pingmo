    - paragraph [ref=e2516]: 目标评价采用独立 chirp 记录辨识的模型，并用另两类记录进行外部预测检验，24 次检验均满足预设 VAF≥85%。全部结果按策略种子分别报告；同一对象的多条指令属于重复测试，不作为独立飞机样本计算总体置信区间。
    - heading "5 实验结果" [level=2] [ref=e2517]
    - heading "5.1 教师学习与迭代蒸馏" [level=3] [ref=e2518]
    - paragraph [ref=e2519]: 36 个教师共经历 221,184,000 次状态转移。在独立指令测试中，三个种子的教师通过率为 82.4%、61.1%、61.1%；要求一个对象的全部指令均通过时，分别为 8/12、4/12、4/12。教师在部分对象上形成了有效控制，同时向蒸馏阶段提供了质量不同的监督。所有教师均保留，完整学习曲线见附录 C.1。
    - paragraph [ref=e2520]: 以这些教师的轨迹完成初始 BC 后，六轮重新采样进一步改变了学生的闭环表现。图 2 显示，三个种子的最佳验证 RMSE 分别从 BC 阶段的 4.668、6.895、10.908 deg/s 降至 0.960、1.380、2.088 deg/s，对应第 6、5、4 轮。S2 和 S3 后续轮次发生回升，说明迭代中的最佳模型并不总在最后一轮。
    - figure [ref=e2521]:
      - img "BC 与六轮闭环采样后的验证 RMSE。三个种子全部显示，选定轮次分别为 6、5、4，后两种子的末轮误差回升。"
      - generic [ref=e2522]:
        - text: 图 2 多轮蒸馏的源对象验证误差。纵轴为平均 RMSE（deg/s），空心大圈标出只按验证集选取的模型。每轮均新增闭环样本并保留历史数据；曲线展示实际三个种子，不是总体置信区间。
        - link "逐轮数据" [ref=e2523] [cursor=pointer]:
          - /url: evidence/story_figure_data.json
        - text: 。
    - paragraph [ref=e2524]: 这些曲线记录了完整迭代过程相对初始 BC 的改善。由于采样量和优化次数同时增加，改善尚不能单独归因于 DAgger 的采样方式。后续测试统一使用验证选出的学生，检查较低验证误差能否转化为能力保留和未见对象控制。
