      - text: ：前者决定被控对象的动态，后者决定由观测到动作的映射。各教师对应固定对象，蒸馏后的学生则以共享权重在多个对象上形成反馈闭环，作为最终控制器。训练完成后，先以冻结学生检验未见对象上的闭环表现，再对需要进一步匹配的新目标进行适配。
