      - text: 每步 1.76 N 的最大请求力增量对应 88 N/s 的速率上限；执行机构为时间常数 20 ms 的一阶环节。奖励中的参考与输出在动作执行后的同一时刻对齐，三项代价分别衡量跟踪误差、施加力和力速率动作。教师优化有限 8 s 任务内的累计折扣回报，使用 GAE 估计优势
