    - heading "5.4 DHC-6 辨识对象上的适配" [level=3] [ref=e2621]
    - paragraph [ref=e2622]: 最后检验统一学生在新目标上的进一步使用。相同的 240 s 目标辨识记录和 64 次更新下，预训练后适配在三个种子的留出工况上分别达到 75.0%、75.0%、80.6%，同预算从零训练为 58.3%、63.9%、61.1%，提升 11.1–19.4 个百分点；适配结果也均高于冻结学生。图 4 同时展示适配工况与留出工况，完整计数见附录 C.3。
    - figure [ref=e2623]:
      - img "三个种子在适配和留出工况上的通过率。预训练后适配均高于同目标预算从零训练，留出工况提升 11.1 至 19.4 个百分点。"
      - generic [ref=e2624]:
        - text: 图 4 目标适配的三组对照。纵轴为通过全部项目门限的案例比例，两面板分别包含 144 和 72 个案例/种子。两可训练组共享目标数据、网络与更新预算；连线只辅助比较种子。
        - link "完整绘图数据" [ref=e2625] [cursor=pointer]:
          - /url: evidence/story_figure_data.json
        - text: 。
    - paragraph [ref=e2626]: 结果支持源域学生作为当前辨识目标的有效适配起点。该比较采用固定目标预算，未测量达到同等性能所节省的数据或总计算量；适配与留出工况的构成不同，两组之间的绝对通过率也不直接表示适配收益。
    - heading "6 讨论" [level=2] [ref=e2627]
    - heading "6.1 从能力压缩到可靠控制" [level=3] [ref=e2628]
    - paragraph [ref=e2629]: 实验将品质相关对象族、特权教师和普通观测学生连接起来，得到一个在多对象上运行的小型控制器。其主要进展在于：多个教师的行为可以被统一网络承接，学生在未见对象上仍能完成部分控制任务。与此同时，源对象上的蒸馏损失和未见对象上的恢复退化说明，能力传递尚不均匀。整体平均误差下降与部分案例受损可以同时发生，单一平均指标难以概括这种变化。
    - paragraph [ref=e2630]: 当前验证选模依据平均 RMSE，教师奖励优化有限 8 s 内的跟踪、施加力和动作代价。对象级全指令通过、扰动恢复以及更长时间运行提出了额外要求。后续应先确定符合模型和输入能力的有限滚转机动、反向指令及恢复任务，再将训练目标和选模指标与这些要求对齐。长期恒定滚转速率还涉及累计姿态变化，需要在更完整的对象描述中处理。
    - heading "6.2 适用范围与组件验证" [level=3] [ref=e2631]
    - paragraph [ref=e2632]: 当前对象族是按品质相关参数构造的研究环境，其联合退化覆盖仍不充分，也尚未证明全部参数组合均对应物理可实现的飞机。普通观测中的施加力、导数和历史在实际平台上的获取方式，需要进一步明确。因而，本研究的结论是滚转仿真中的构建可行性；耦合通道、完整飞控闭环与真实平台构成后续验证层次。
    - paragraph [ref=e2633]: 对于方法本身，现有实验还不能分离品质组织、特权信息、网络容量与迭代采样的独立贡献。相同预算下的采样方式、同容量有/无特权教师、不同教师与学生规模、等计算量 BC 与 DAgger，以及直接训练统一策略的对照，将帮助定位能力损失的来源。PPO 是当前教师训练方法，网络结构承载策略表示；它们的选择应以闭环结果比较。新的对照需要独立冻结协议，不能由本次端到端结果反推每个组件都必要。
    - heading "7 结论" [level=2] [ref=e2634]
    - paragraph [ref=e2635]: 本文研究了以品质相关对象族训练特权教师，并通过多轮闭环蒸馏形成统一飞控控制器的方法。滚转实验获得了一个含 3,856 个参数、仅使用普通观测及历史的学生，并验证其在多个源对象和部分未见对象上的控制能力。这支持所述控制器构建路线的初步可行性。
    - paragraph [ref=e2636]: 能力保留、扰动恢复和持续控制仍存在明显限制，当前结果尚不足以支持可靠的通用飞控。后续工作应优先改善源对象覆盖与控制能力传递，在一致的跟踪和恢复要求下开展组件对照，再向耦合动态和完整平台扩展。
