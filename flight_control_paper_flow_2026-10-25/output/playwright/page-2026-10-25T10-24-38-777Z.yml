    - paragraph [ref=e944]: 本实验从已有 5,000 对象库中预先选择 12 个源对象，部分品质 L1/L2/L3 各 4 个，并留出 24 个 ID 和 24 个 OOD 对象。分层依据选定的滚转时间常数、螺旋、荷兰滚和一秒灵敏度判据，用于组织源域差异，不等同于整机 GJB 等级。具体边界和库中未覆盖的组合见附录 B。
    - paragraph [ref=e945]: 式 (2) 的有理部分转换为四维状态空间，以 1 ms 步长推进；纯时延通过队列实现。对象内部状态为传递函数的实现状态，不直接对应侧滑角、偏航角速度等物理量；等效 N 输入和附加执行机构属于研究接口。该操纵力—速率映射与接入策略后的指令—闭环速率映射分别定义，以便明确对象和控制器的边界。
