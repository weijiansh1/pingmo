  - main [ref=e95]:
    - heading "基于飞行品质模型的飞控控制器构建：特权教师与多轮蒸馏" [level=1] [ref=e96]
    - paragraph [ref=e97]: 滚转通道可行性研究 · 2026-10-25
    - heading "摘要" [level=2] [ref=e98]
    - paragraph [ref=e99]: 面向动态特性不同的被控对象，统一飞控控制器需要兼顾多样的控制需求、有限的部署信息和模型规模。本文研究一种基于飞行品质模型的控制器构建方法：利用品质相关参数组织训练对象族，在各对象上通过特权强化学习获得专用教师，再通过学生闭环采样、教师标注和数据聚合，将多对象控制行为蒸馏到统一学生。训练时的对象参数和内部状态由教师使用，学生仅根据普通观测及其历史产生控制动作。以滚转通道为验证任务，本文在预先划分的 12 个源对象、24 个同分布留出对象和 24 个分布外对象上开展三个策略种子的实验。得到的学生含 3,856 个参数，其同分布和分布外测试通过率分别为 40.7%–68.1% 和 38.9%–51.4%；迭代训练后的验证误差低于初始行为克隆，DHC-6 辨识仿真中的目标适配也获得正向对照结果。实验支持从品质相关对象族构建轻量统一飞控控制器的初步可行性，同时显示蒸馏能力损失、恢复退化和长时失效仍限制其可靠性。
    - paragraph [ref=e100]:
      - strong [ref=e101]: 关键词：
      - text: 飞控控制器；飞行品质模型；特权强化学习；多教师；多轮蒸馏；跨对象控制
    - heading "1 引言" [level=2] [ref=e102]
    - paragraph [ref=e103]: 飞控控制器需要在完成指令跟踪的同时，抑制不良振荡并使系统在受到扰动后恢复。不同对象的响应速度、阻尼、操纵效能和时延并不相同：相同的控制动作，可能在一个对象上形成平缓响应，在另一个对象上造成较大超调或持续振荡。因此，面向对象族的统一控制器必须能够根据对象的实际响应调整动作。本文关注如何通过学习获得这样的控制器，并使其保持适合后续部署的小型结构。
    - paragraph [ref=e104]: 这一问题包含两个相互关联的困难：训练对象需要覆盖有控制意义的动态变化，统一策略则需要在真实参数和内部状态不可直接获得时，仅凭可用信号作决策。本文以飞行品质相关描述组织对象差异，将响应快慢、振荡衰减、螺旋趋势和时延等特征转化为训练对象族。在策略学习上，先解决对象已知条件下的专用控制，再学习仅依靠观测历史的共享反馈，使对象控制与跨对象信息推断能够分阶段处理。
    - paragraph [ref=e105]: 第一阶段为各源对象训练专用教师，利用仿真可提供的参数和内部状态学习控制行为。第二阶段训练共享学生，利用当前观测和输入输出历史拟合多个教师。学生执行误差会改变后续轨迹，因此蒸馏还需要在学生自己访问的状态上持续补充教师指导。多轮闭环采样由此将动作拟合与实际使用过程联系起来。该设计的预期价值是：在离线阶段学习多样对象上的控制行为，在使用阶段运行一个具有统一输入接口的轻量反馈策略。
    - paragraph [ref=e106]: 本文选择滚转通道进行可行性验证，考察指令跟踪、指令响应中的振荡，以及初始偏差和外部扰动后的恢复。实验依次检查教师学习、学生能力保留和未见对象表现，最后将目标适配作为统一控制器的延伸使用方式。研究形成了对象构造、特权训练和闭环蒸馏的一致实现，并通过三个策略种子的独立评价，确定这条构建路线已经实现的能力与仍然存在的限制。滚转验证为后续扩展提供依据，本文结论限定于所采用的参数化对象和辨识仿真。
    - heading "2 相关工作" [level=2] [ref=e107]
    - heading "2.1 飞行品质描述与学习控制" [level=3] [ref=e108]
    - paragraph [ref=e109]:
      - text: GJB 2874—1997 中的滚转响应和低阶等效系统描述，为组织品质相关动态提供了依据
      - superscript [ref=e110]: "[1]"
      - text: 。Davidson 与 Andrisani 将传递函数、模态和输出响应联系起来
      - superscript [ref=e111]: "[2]"
      - text: ；Morelli 研究了包含机体与控制系统共同效应的 LOES 辨识
      - superscript [ref=e112]: "[3]"
      - text: 。这些工作表明，对象描述需要同时考虑极点、零点和输入输出边界，才能解释可见的响应特征。本文据此构造训练环境，并在接入控制器后单独评价新闭环。
    - paragraph [ref=e113]:
      - text: 强化学习已经用于航空控制与品质评价。Jansen 与 van Kampen 研究 SAC 飞控的纵向操纵品质评价
      - superscript [ref=e114]: "[4]"
      - text: ，Bøhn 等研究固定翼姿态控制的仿真到实飞迁移
      - superscript [ref=e115]: "[5]"
      - text: 。对于跨对象控制，RMA 和 Extreme Adaptation 利用历史信号实现对动力学变化的适应
      - superscript [ref=e116]: "[9,10]"
      - text: 。与本文流程最接近的 RAPTOR 为 1,000 个四旋翼对象训练专用教师，再蒸馏出 2,084 参数的循环学生，并在多个真实平台上验证
      - superscript [ref=e117]: "[11]"
      - text: 。本文考察品质相关滚转对象族上的教师—学生控制学习，重点评价统一学生的跟踪、恢复和能力保留。
    - heading "2.2 特权学习与闭环蒸馏" [level=3] [ref=e118]
    - paragraph [ref=e119]:
      - text: LUPI 与广义蒸馏允许训练和使用阶段具有不同的信息条件
      - superscript [ref=e120]: "[6,7]"
      - text: 。Asymmetric actor–critic 将完整信息供给 Critic、由 Actor 使用部署观测
      - superscript [ref=e121]: "[8]"
      - text: ；本文的教师 Actor 也使用仿真特权信息，随后通过蒸馏将控制行为传递给普通观测学生。Policy Distillation 为多策略合并提供了基本方法
      - superscript [ref=e122]: "[12]"
      - text: ，DAgger 则在学习策略访问的状态上追加专家标签，以处理训练分布与使用分布的变化
      - superscript [ref=e123]: "[13]"
      - text: 。Distilling Policy Distillation 进一步讨论了采样分布和更新目标对蒸馏的影响
      - superscript [ref=e124]: "[14]"
      - text: 。
    - paragraph [ref=e125]:
      - text: 本文的多轮蒸馏沿用这一交互式思路，每轮重新采集学生轨迹并保留历史数据。它与 Born Again Networks 的多代训练、Teacher Assistant KD 的中间容量教师设计分别对应不同的蒸馏方式
      - superscript [ref=e126]: "[15,16]"
      - text: 。本研究采用已有的 PPO、特权学习和 DAgger，考察其在品质相关对象族上的连续控制效果；方法各环节的独立贡献由后续消融进一步区分。
    - heading "3 统一飞控控制器的构建方法" [level=2] [ref=e127]
    - heading "3.1 控制任务与方法概述" [level=3] [ref=e128]
    - paragraph [ref=e129]:
      - text: 本文将控制器构建分为对象族组织、专用教师学习和统一学生蒸馏三个环节，如图 1 所示。记对象参数为
