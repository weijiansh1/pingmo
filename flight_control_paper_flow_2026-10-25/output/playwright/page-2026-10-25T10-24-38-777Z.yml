    - paragraph [ref=e2118]: 这一更新将监督扩展到学生实际容易访问的状态。BC 先训练 30 个 epoch，随后重新采集六轮，每轮在全部累计数据上训练 8 个 epoch。前两轮分别以 0.5、0.25 的概率执行教师动作，之后完全执行学生动作；每批新增 153,600 个状态，连同 BC 数据后每种子共 1,075,200 个样本。模型只根据源对象验证指令选取，不使用测试成绩选模。
    - paragraph [ref=e2119]: 学生保留历史卷积和残差结构，将主干缩小为宽度 32 的一个残差块，共 3,856 个可训练参数。与教师相比，学生同时承担模型压缩和信息条件变化；它必须从输入输出历史中利用对象差异。蒸馏后的能力因此通过闭环测试评价，而非仅由动作拟合误差判断。
    - heading "3.5 新目标适配" [level=3] [ref=e2120]
    - paragraph [ref=e2121]: 冻结学生首先接受未见对象测试；进一步的目标适配用于检验它能否作为新对象的训练起点。本文使用 DHC-6 仿真记录辨识的 ARX 模型，比较冻结学生、预训练后适配和同目标预算从零训练三组。两个可训练组使用相同网络、目标数据、指令、优化器和更新次数，只改变初始化。
    - paragraph [ref=e2122]: 适配沿用源域的观测与增量力接口，通过完整模型轨迹的梯度更新学生权重。该环节属于辨识模型上的梯度优化，详细损失、执行机构映射和数据划分见附录 A.5；它与源域教师的 PPO 训练分别定义。
