  - main [ref=e83]:
    - heading "基于飞行品质模型的飞控控制器构建：特权教师与多轮蒸馏" [level=1] [ref=e84]
    - paragraph [ref=e85]: 滚转通道可行性研究 · 2026-10-25
    - heading "摘要" [level=2] [ref=e86]
    - paragraph [ref=e87]: 面对响应速度、振荡特性、控制效能和时延不同的被控对象，如何学习一个使用统一观测接口的轻量飞控控制器？本文研究基于飞行品质模型的控制器构建路线：以品质相关动力学描述构造训练对象族，以特权强化学习分别获得各对象的专用教师，再通过多轮学生闭环采样与教师标注，将多对象控制能力集中到统一学生中。教师利用仿真中的真实参数和内部状态学习控制，学生根据普通观测及其历史输出控制动作。该设计旨在连接多样对象上的控制学习与统一控制器的部署，并在遇到新目标时保留适配能力。
    - paragraph [ref=e88]: 本文以滚转通道检验这条路线，评价指令跟踪、指令响应及初始偏差和扰动后的恢复。在训练前冻结的 12 个源对象、24 个同分布留出对象、24 个分布外对象及三个策略种子上，完成了 36 个教师和三个 3,856 参数学生的训练与独立闭环评价。相对单个教师 Actor，学生参数量约缩小 1,104 倍；学生在同分布、分布外留出对象上的项目门限通过率分别为 40.7%–68.1%、38.9%–51.4%。多轮蒸馏相对初始行为克隆降低了验证误差，但存在能力损失、种子差异和恢复失败。在 DHC-6 辨识仿真上的适配进一步提供了正向对照。结果表明，所述链路能够形成跨对象运行的统一控制器，同时仍需提高能力保留、对象覆盖和闭环可靠性；当前滚转结果不构成完整飞机飞行品质保证。
    - paragraph [ref=e89]:
      - strong [ref=e90]: 关键词：
      - text: 飞控控制器；飞行品质模型；特权强化学习；多教师；多轮蒸馏；跨对象控制
    - heading "1 引言" [level=2] [ref=e91]
    - paragraph [ref=e92]:
      - text: 飞控控制器需要在对象动态和工况变化时完成指令跟踪，并控制响应中的振荡及扰动后的恢复。针对一个对象训练成功的策略，在另一个响应更慢、阻尼更低或时延更大的对象上可能需要不同动作。本文关注的核心问题是：
      - strong [ref=e93]: 能否面向具有不同飞行品质相关动态的对象族，学习一个轻量、使用统一接口的飞控控制器？
      - text: “品模”路线的最终产物是这个控制器；对象模型为控制器学习提供环境，飞行品质相关描述为环境中的差异提供依据。
    - paragraph [ref=e94]: 实现这一目标需要同时处理三个问题。首先，训练对象必须覆盖有控制意义的动态差异，否则共享策略可能只适用于狭窄对象范围。其次，训练环境中的真实参数和内部状态，在实际控制时通常无法直接获得。最后，学生的动作误差会改变后续访问状态，只在教师轨迹上拟合动作，未必能维持闭环表现。这三个问题分别指向对象族的组织、训练与部署的信息分工，以及闭环状态上的蒸馏。
    - paragraph [ref=e95]: 本文据此采用“品质相关对象族—特权教师—统一学生”的构建方式。对象族按响应速度、振荡衰减、发散趋势和时延等特征提供多样训练环境；各教师在对象明确、内部信息可用的条件下学习控制；学生通过多教师监督和多轮闭环采样，将这些行为归纳到一个网络中。部署时，学生利用当前观测和输入输出历史作决策，无需在网络输入中显式给定真实对象参数。历史是否足以支持这种判断，以及蒸馏是否保留控制能力，均由闭环实验检验。
    - paragraph [ref=e96]: 这条设计值得研究的原因，是它把学习多样控制行为的离线过程，与运行一个小型反馈策略的部署过程连接起来。它追求三个结果：在不同对象上获得控制能力，将能力集中到统一轻量模型，并在未见对象上保持可接受的跟踪与恢复。目标适配是面对剩余差异时的后续环节。每一步都可能损失能力，因此评价必须沿教师、学生和未见对象连续展开；参数规模、动作拟合误差和目标适配收益不能互相替代。
    - paragraph [ref=e97]: 现阶段采用滚转角速度通道验证路线可行性。该任务同时包含振荡模态、时延和输入限制，能够观察控制学习与能力传递中的问题。当前滚转验证以抑制振荡、保留指令跟踪为重点，既评价指令引起的响应，也评价初始偏差和外部扰动后的恢复。滚转是这条飞控构建路线的验证载体；当前结果的适用范围为参数化滚转对象和 DHC-6 辨识仿真。
    - paragraph [ref=e98]: 本文建立了从品质相关对象族、专用教师到统一学生的一致控制接口，在对象与指令隔离、三个独立策略种子的协议下检验教师控制、多轮蒸馏和未见对象闭环表现，并以目标适配作延伸验证。PPO、特权学习和 DAgger 均采用已有方法；研究问题在于这些环节能否共同形成所需控制器，以及能力在哪一步受限。
    - heading "2 相关工作与研究位置" [level=2] [ref=e99]
    - heading "2.1 飞行品质为训练对象提供什么" [level=3] [ref=e100]
    - paragraph [ref=e101]:
      - text: GJB 2874—1997 的飞行品质条款及低阶等效系统描述，为理解滚转响应和相关模态提供依据
      - superscript [ref=e102]: "[1]"
      - text: 。Davidson 与 Andrisani 讨论了传递函数、模态与响应之间的关系
      - superscript [ref=e103]: "[2]"
      - text: ；Morelli 的 LOES 辨识以驾驶操纵和飞机响应为输入输出，描述中可以包含机体与控制系统的共同作用
      - superscript [ref=e104]: "[3]"
      - text: 。这些工作提示：对象族应同时说明极点、零点、控制接口和评价条件，单个阻尼值不能完整决定可见响应。
    - paragraph [ref=e105]:
      - text: 强化学习与航空品质评价已有直接联系。例如，Jansen 与 van Kampen 研究 SAC 飞控的纵向操纵品质评价
      - superscript [ref=e106]: "[4]"
      - text: ；Bøhn 等研究固定翼姿态控制的仿真到实飞迁移
      - superscript [ref=e107]: "[5]"
      - text: 。本文将品质相关描述放在源对象组织环节，尝试为跨对象学习提供可解释的变化维度。标准中的边界并不自动给出真实机队的采样分布，也不使训练奖励自动成为完整品质评价。
    - heading "2.2 特权学习、历史适应与小型通用策略" [level=3] [ref=e108]
    - paragraph [ref=e109]:
      - text: LUPI 与广义蒸馏区分训练时可用的信息和部署时可用的信息
      - superscript [ref=e110]: "[6,7]"
      - text: 。Asymmetric actor–critic 将更完整的信息供给 Critic，而 Actor 使用部署观测
      - superscript [ref=e111]: "[8]"
      - text: ；本文还让专用教师 Actor 读取对象参数和内部状态，再向无显式特权输入的学生传递动作监督。因此，本文同时涉及信息条件变化与模型压缩。
    - paragraph [ref=e112]:
      - text: RMA 和 Extreme Adaptation 利用历史信号形成对动力学的适应
      - superscript [ref=e113]: "[9,10]"
      - text: 。与本文链路最接近的 RAPTOR，为 1,000 个四旋翼对象分别训练教师，再蒸馏为 2,084 参数的循环学生，并在多个真实四旋翼上验证
      - superscript [ref=e114]: "[11]"
      - text: 。已有工作已经表明，多教师、小型统一策略和跨平台适应可以构成完整路线。本文将这一类问题放到品质相关的滚转对象族上，关注教师控制能力向普通观测学生的传递，以及在跟踪和恢复任务中的跨对象表现。多教师蒸馏本身不被当作首次提出的方法。
    - heading "2.3 为什么需要学生闭环采样" [level=3] [ref=e115]
    - paragraph [ref=e116]:
      - text: Policy Distillation 将多个策略的行为转移到统一策略
      - superscript [ref=e117]: "[12]"
      - text: 。若监督数据只来自教师轨迹，学生执行误差可能使它访问训练集中较少出现的状态。DAgger 在学习策略访问的状态上追加专家标注，直接处理这种分布变化
      - superscript [ref=e118]: "[13]"
      - text: ；Distilling Policy Distillation 进一步讨论了采样分布与蒸馏目标的关系
      - superscript [ref=e119]: "[14]"
      - text: 。本文的“多轮”是多次闭环采样、标注和聚合，并非同一数据上的重复训练，也不是将上一代学生升级为下一代教师。Born Again Networks 与 Teacher Assistant KD 对应后两类蒸馏设计中的不同问题
      - superscript [ref=e120]: "[15,16]"
      - text: ，不构成本文迭代收益的证据。
