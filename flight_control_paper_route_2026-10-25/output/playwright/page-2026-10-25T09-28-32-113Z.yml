    - paragraph [ref=e6326]: 本文主结果仅使用 controller-route-v1：12 个源对象、三个策略种子、同一 3,856 参数学生与 64 次目标更新。早期交付中的 49/46 教师、75,040 参数 small 学生、不同轮次迁移以及 SAE/延迟探针属于其他实验，未纳入本文主表，也未据此扩大结论。原稿及完整核查材料保留在此前版本目录，本次主线对齐与公式排版修订没有新增训练或改动冻结结果。
