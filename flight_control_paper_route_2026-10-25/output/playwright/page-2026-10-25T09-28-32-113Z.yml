    - paragraph [ref=e3481]: 这一结果是蒸馏的起点：学生接收的是有能力差异的教师集合。评价学生时既要检查压缩与信息变化造成的损失，也要保留教师本身未学好的案例。全部教师均参与后续蒸馏，没有按测试效果挑选教师。
