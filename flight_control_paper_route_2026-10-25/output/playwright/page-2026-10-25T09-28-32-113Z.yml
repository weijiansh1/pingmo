      - text: 轮行为策略诱导的状态分布；前两轮以一定概率执行教师动作，之后完全执行学生动作。优化用有限轮 Adam 近似式 (5)。这一过程使教师能够在学生偏离原教师轨迹后继续提供纠正信号，目标是减少监督分布与学生使用分布之间的差距。
    - paragraph [ref=e2567]: BC 训练 30 个 epoch，随后实际采集 6 轮，每轮在累计数据上训练 8 个 epoch。教师行为概率依次为 0.5、0.25、0、0、0、0；每批新增 153,600 个状态，含初始 BC 数据后每种子共 1,075,200 个状态。统一学生只有 3,856 个参数；按源对象验证指令的平均 RMSE 选择轮次，不使用测试成绩选模。
    - paragraph [ref=e2568]: 迭代的作用受信息条件约束。如果两个对象在学生可见历史上无法区分，却需要不同控制动作，更多教师标签仍可能相互冲突。历史长度、网络容量和教师质量共同影响学生表现；增加蒸馏轮数本身不提供单调改进或闭环稳定性保证。
