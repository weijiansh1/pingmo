    - paragraph [ref=e1166]: 这样的组织方式把“改变对象”转化为改变可解释的响应特征。例如，降低振荡模态的衰减率会增加恢复挑战，增加时延会改变反馈动作产生效果的时刻。教师在这些不同对象上学习，学生尝试从输入输出历史中适应差异。品质参数在这里提供训练空间的描述语言；其覆盖是否充分、是否比其他采样方式更有效，需要分别评价。
    - paragraph [ref=e1167]: 本实验从已有 5,000 对象库中预先选择 12 个源对象，部分品质 L1/L2/L3 各 4 个，同时冻结 24 个 ID 与 24 个 OOD 对象。部分标签来自选定的滚转时间常数、螺旋、荷兰滚和一秒灵敏度判据，不能解释为整机 GJB 等级。源对象没有因教师表现不佳而被删除。对象库仍存在联合退化覆盖不足，具体限制及尚未训练的新构造样例列于附录 B。
    - paragraph [ref=e1168]: 式 (2) 的操纵力—速率映射，与接入策略后的指令—闭环速率映射不同。当前等效 N 输入和附加执行机构是明确的研究接口。若后续使用已经包含原控制系统的辨识对象，必须重新核对控制边界，防止重复加入执行机构或原飞控效应。
    - heading "3.3 特权教师：在对象明确时学习控制" [level=3] [ref=e1169]
    - paragraph [ref=e1170]: 专用教师把“给定对象上如何控制”与“仅凭部署观测如何应对对象差异”分为两个学习阶段。这里选择强化学习，是为了在相同指令、输入约束和累计代价下，通过闭环交互为各对象产生控制监督，而无需先为每个对象指定一套教师控制律。这是训练设计的动机；它不要求 PPO 必须优于其他控制设计，经典控制器作为教师也是后续可比较的选择。
