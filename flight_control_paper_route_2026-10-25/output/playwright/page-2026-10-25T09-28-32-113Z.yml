      - emphasis [ref=e3753]:
        - text: 图 5 相同目标预算下的闭环通过率。两面板分别为适配工况与留出工况；横坐标为三个策略种子，纵轴为通过率，所有比例保留完整分母。点和线型区分三种初始化/更新方式，连线只帮助比较种子，不表示连续趋势；不将多条指令当作独立重复计算误差条。
        - link "绘图数据" [ref=e3754] [cursor=pointer]:
          - /url: evidence/story_figure_data.json
        - text: 。
    - paragraph [ref=e3755]: 这些结果回答的是“固定目标预算下，源域经验是否有帮助”。本实验只测试一个目标数据量和一个更新预算，尚不能给出达到同等性能所节省的数据量、更新次数或总计算量。留出组通过率高于适配组也不意味着未见工况天然更容易适应；两组工况不同，不能把它们之间的差值作为适配收益。
    - heading "6 讨论：当前价值与尚缺的证据" [level=2] [ref=e3756]
    - heading "6.1 沿构建链路判断控制器能力" [level=3] [ref=e3757]
    - paragraph [ref=e3758]: 本研究的主体是统一飞控控制器的构建。对象族决定教师见过哪些动态，教师决定学生能得到什么监督，蒸馏决定监督能否转化为普通观测下的控制，未见对象测试则检验这一能力是否超出源对象。当前实验把这些环节连接起来，并形成一个可在不同对象上运行的 3,856 参数学生。
    - paragraph [ref=e3759]: 链路可运行与控制器可靠是两个需要分别检验的结果。教师通过率存在种子差异，学生在一个种子中有明显能力损失，未见对象上的全指令通过率和恢复收益仍不足。多轮蒸馏的验证改善、参数压缩和目标适配正结果，为不同环节提供证据，但不能补齐未通过的闭环要求。后续改进应定位能力在哪一环节丢失，再用相同任务和指标比较。
    - heading "6.2 区分整条路线与各组件的作用" [level=3] [ref=e3760]
    - paragraph [ref=e3761]: 品质相关参数使对象差异与控制问题建立联系，特权教师为各对象学习提供仿真信息，迭代蒸馏针对学生访问状态补充监督。这些选择共同服务于统一控制器的形成。现阶段的结果支持对整条路线继续研究，各组件是否必要、哪种选择更有效，还需要独立对照。
    - paragraph [ref=e3762]: 对象库的多项退化组合覆盖不足，会限制学生接触的控制情形。新构造的 190 对象样例改善了显式组合与边界覆盖，但尚未训练，不能用于解释已有性能。采样方式对照应固定教师数、对象范围和训练预算；特权信息、学生容量、历史长度和蒸馏数据分布也应分别控制。它们是完善路线解释的实验，不能只凭其中一个对照来定义整项研究的价值。
    - paragraph [ref=e3763]: 目标适配回答统一学生能否进一步用于新的目标；当前只验证一个目标数据量和更新预算。若讨论数据效率或总体成本，还需预算曲线，并计入源域教师及蒸馏成本。当前相同目标预算下的收益保留为延伸结果，不替代主要的跨对象闭环评价。
    - heading "6.3 可靠性要求训练任务和使用任务一致" [level=3] [ref=e3764]
    - paragraph [ref=e3765]:
      - text: 目前教师优化有限 8
      - generic [ref=e3767]:
        - math [ref=e3769]:
          - generic [ref=e3770]: s
        - generic [ref=e3774]: s
      - text: 跟踪代价；恢复、持续控制和对象级全指令通过率揭示了额外要求。下一阶段应先定义与模型和输入能力相容的有限滚转机动、反向指令及长时恢复任务，再固定评价和训练目标。长时间恒定滚转速率还涉及累计姿态变化，超出了局部滚转模型能充分描述的范围。
    - paragraph [ref=e3775]: 算法方面，需要分别比较同容量有/无特权教师、直接训练统一策略与教师—学生路线、等计算量 BC 与迭代采样，以及不同学生容量和历史长度。它们回答不同问题，不能由一次端到端适配收益反推每个环节都必要。全部比较应保留难对象、种子差异和失败案例，以避免平均指标掩盖恢复受损。
    - heading "7 结论" [level=2] [ref=e3776]
    - paragraph [ref=e3777]: 本文研究基于飞行品质模型构建飞控控制器的路线：组织具有不同品质相关动态的对象族，利用特权强化学习训练专用教师，再以多轮闭环蒸馏形成只使用普通观测与历史的统一学生。滚转验证完成了教师控制、学生能力保留、未见对象跟踪与恢复的连续评价；目标适配作为后续环节单独验证。
    - paragraph [ref=e3778]: 3,856 参数学生能够在多个对象上闭环运行，实际多轮采样相对初始行为克隆降低了验证误差，说明这条训练与部署链路具有继续研究的基础。同时，能力保留和跨对象可靠性尚不充分，恢复受损与长时失败限制了目前的控制结论。后续应围绕源对象覆盖、教师质量、信息与容量约束及可达控制任务改进路线，再扩展到耦合通道、完整飞控闭环和真实平台。
